<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>semantle duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f3ec; --ink: #1d1b18; --faint: #8b857a; --rule: #ddd6c8;
    --serif: "EB Garamond", Garamond, Georgia, serif;
    --hot: #d4471f; --warm: #d98b2b; --cool: #6b8fa3; --you: #1d1b18;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #15140f; --ink: #ece6d8; --faint: #7e786c; --rule: #2c2a24; --you: #ece6d8; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 18px/1.35 var(--serif); font-variant-numeric: lining-nums; min-height: 100dvh; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  /* home */
  #home { min-height: 100dvh; display: grid; place-content: center; gap: 2.5rem; padding: 16px; text-align: center; }
  #home h1 { font: 400 clamp(2.4rem, 9vw, 4.5rem)/1 Georgia, "Times New Roman", serif; letter-spacing: -.02em; margin: 0; }
  #home h1 i { color: var(--hot); }
  #home h1 { white-space: nowrap; cursor: default; -webkit-tap-highlight-color: transparent; }
  /* the title's last word: "duel" swipes in, then flips through its neighbours and lands back on "duel" */
  .roll { position: relative; display: inline-block; vertical-align: bottom; height: 1.2em; margin-bottom: -.12em; perspective: 4em; transition: width .45s cubic-bezier(.3,.7,.2,1); text-align: left; }
  .roll > span { position: absolute; left: 0; bottom: .12em; white-space: nowrap; font-style: italic; color: var(--hot); backface-visibility: hidden; transform-origin: 50% 50% -.4em; }
  .roll > span.won small { color: var(--hot); }
  .roll > span small { position: absolute; right: 0; top: 100%; margin-top: .05em; font: 400 .8rem/1 var(--serif); font-style: normal; color: var(--faint); font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .roll > span.in { animation: flipin .5s cubic-bezier(.3,.7,.2,1) both; }
  .roll > span.out { animation: flipout .5s cubic-bezier(.5,0,.8,.4) both; }
  .roll > span.swipe { animation: swipe .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes flipin { from { transform: rotateX(90deg); opacity: 0; } }
  @keyframes flipout { to { transform: rotateX(-90deg); opacity: 0; } }
  @keyframes swipe { from { clip-path: inset(0 100% 0 0); transform: translateX(.6em); opacity: 0; } to { clip-path: inset(0 -1em 0 0); } }
  @media (prefers-reduced-motion: no-preference) { .roll > span:not([class]) { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .roll > span { animation: none !important; } .roll { transition: none; } }
  #home nav { display: flex; gap: 2rem; justify-content: center; }
  #home nav button { font-size: 1.15rem; border-bottom: 1.5px solid currentColor; padding-bottom: 2px; }
  #home nav button, #home nav a { font-size: 1.15rem; border-bottom: 1.5px solid currentColor; padding-bottom: 2px; color: inherit; text-decoration: none; }
  #home nav .quiet { color: var(--faint); }

  /* archive */
  #archive { max-width: 640px; margin: 0 auto; padding: 22px 16px 60px; }
  #archive .back { font: 400 1.6rem/1 var(--serif); color: inherit; text-decoration: none; }
  #archive .back i { color: var(--hot); }
  #archive h3 { font: 400 1.05rem var(--serif); color: var(--faint); margin: 2rem 0 .5rem; }
  #archive .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr)); gap: 2px 6px; }
  #archive .grid button { text-align: left; padding: .4rem .2rem; border-bottom: 1px solid var(--rule); display: grid; }
  #archive .grid button:hover { border-color: var(--ink); }
  #archive .grid b { font-weight: 400; }
  #archive .grid small { color: var(--faint); font-size: .72rem; }
  #archive .grid button.played b { color: var(--hot); }
  #home .past { margin: 1rem auto 0; padding: 0; list-style: none; text-align: left; font-size: .9rem; width: min(100%, 26rem); }
  #home .past li { display: block; padding: 0; border: 0; }
  #home .past a { display: grid; grid-template-columns: 3.4rem 1fr auto; gap: .8rem; padding: .35rem 0; color: var(--faint); text-decoration: none; border-bottom: 1px solid var(--rule); }
  #home .past a:hover { color: var(--ink); }
  #home .past .w { color: var(--hot); }

  /* duel */
  #duel { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  header .no { color: var(--faint); }
  #clock.stopped { color: var(--faint); }
  #pausebar { color: var(--faint); font-size: .95rem; margin-left: .5em; }
  #pausebar button { color: var(--ink); border-bottom: 1px solid currentColor; margin-left: .3em; }
  #board.paused .side.me ol, #board.paused #guess { filter: blur(6px); pointer-events: none; }
  .side form .submit { font-size: 1.05rem; border-bottom: 2px solid var(--hot); padding-bottom: 1px; }
  .side form .submit:disabled { color: var(--faint); border-color: var(--rule); cursor: default; }
  #clock { font: 400 clamp(2.6rem, 10vw, 4rem)/1 var(--serif); letter-spacing: -.02em; }
  #share { color: var(--faint); font-size: .9rem; border-bottom: 1px dotted var(--faint); }
  #banner { font: 400 1.5rem/1.2 var(--serif); margin: 1.4rem 0 .4rem; }
  #banner b { color: var(--hot); font-weight: 400; }

  #lobby { margin-top: 2.2rem; display: grid; gap: 1.6rem; }
  #lobby .who { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; font-size: 1.3rem; }
  #lobby .who span.me { text-decoration: underline; text-underline-offset: 4px; }
  #lobby .who span.empty { color: var(--faint); }
  #lobby form { display: flex; gap: 1rem; align-items: baseline; }
  #go { font: 400 1.6rem var(--serif); border-bottom: 2px solid var(--hot); justify-self: start; }
  #go[disabled] { color: var(--faint); border-color: var(--rule); cursor: default; }

  input.line { -webkit-appearance: none; appearance: none; border-radius: 0; background: none; border: 0; border-bottom: 1.5px solid var(--ink); padding: 4px 0; outline: none; min-width: 0; }
  input.line::placeholder { color: var(--faint); }

  #board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.4rem; margin-top: 1.6rem; align-items: start; }
  #board.crowd { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); row-gap: 1.6rem; }
  #board.crowd .side.me { grid-row: 1 / span 3; }
  #board.crowd .side:not(.me) { font-size: .82rem; }
  #board.crowd .side:not(.me) li.heads { display: none; }
  #board.crowd .side:not(.me) h2 { font-size: 1.05rem; }
  #rivals { display: none; }
  @media (max-width: 700px) {
    #board, #board.crowd { grid-template-columns: 1fr; gap: 2rem; margin-top: 1.2rem; }
    #board.crowd .side.me { grid-row: auto; }
    #board.mine .side:not(.me) { display: none; }
    #rivals:not([hidden]) { display: block; list-style: none; margin: 1rem 0 0; padding: 0; font-size: .88rem; }
    .rival { display: block; padding: 0; border-bottom: 1px solid var(--rule); }
    .rival .sum { width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto 4.2em 8em; gap: .7em; align-items: center; padding: .55em 0; }
    .rival .name { font: 400 1.05rem var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rival .name::before { content: "›"; display: inline-block; width: .9em; color: var(--faint); transition: transform .15s; }
    .rival.open .name::before { transform: rotate(90deg); }
    .rival.first .name { color: var(--hot); }
    .rival .stat { color: var(--faint); font-size: .9em; }
    .rival.found .stat { color: var(--hot); }
    .rival .s { text-align: right; }
    .rival ol { margin: 0 0 .6em 1.1em; font-size: .92em; }
    .rival ol li:last-child { border-bottom: 0; }
  }
  .side h2 { font: 400 1.25rem/1.2 var(--serif); margin: 0 0 .2rem; display: flex; justify-content: space-between; align-items: baseline; }
  .side h2 .stat { font-size: .9rem; color: var(--faint); }
  .side.found h2 .stat { color: var(--hot); }
  .side.first h2 .name { color: var(--hot); }
  .side form { display: flex; align-items: baseline; gap: 1rem; }
  .giveup { font-size: .8rem; color: var(--faint); white-space: nowrap; }
  .giveup[data-sure] { color: var(--hot); }
  li.more { display: block; color: var(--faint); font-size: .85em; border: 0; }
  .side form { margin: .6rem 0 .3rem; position: relative; }
  .side form input { flex: 1; font-size: 1.15rem; }
  #guess { border-bottom-width: 2px; }
  #guess:focus { border-bottom-color: var(--hot); }
  li.note { color: var(--faint); }
  li.note .msg { grid-column: 3 / 5; color: var(--hot); font-size: .85em; font-style: italic; }
  li.again { animation: again 1.6s ease-out; }
  @keyframes again { from { background: color-mix(in srgb, var(--warm) 22%, transparent); } }

  #after { display: flex; flex-wrap: wrap; align-items: baseline; gap: .6rem 1.6rem; margin: .2rem 0 .4rem; font-size: 1.1rem; }
  #after a, #after button { color: inherit; text-decoration: none; border-bottom: 1.5px solid currentColor; padding-bottom: 1px; }
  #after .lead { border-bottom: 2px solid var(--hot); }
  #after .quiet { color: var(--faint); }
  #after .pick { display: contents; }
  #after .pick span { color: var(--faint); }

  ol { list-style: none; margin: .5em 0 0; padding: 0; }
  li { display: grid; grid-template-columns: 2em minmax(0, 1fr) 4.6em 8em; align-items: center; gap: .6em; padding: .32em 0; border-bottom: 1px solid var(--rule); }
  li.heads { color: var(--faint); border-bottom-color: var(--ink); padding-top: 0; }
  li.heads span { font-size: .75em; }
  li.latest { border-bottom: 1.5px solid var(--ink); margin-bottom: .5em; }
  li .n { color: var(--faint); font-size: .8em; }
  li.pending { color: var(--faint); }
  li .w { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .w.hidden { filter: blur(5px); user-select: none; color: var(--faint); }
  li .s { text-align: right; }
  li .p { font-size: .85em; white-space: nowrap; }
  li .p.num { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: .4em; }
  li .p .bar { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
  li .p .bar i { display: block; height: 100%; background: var(--hot); }
  li .p.temp { color: var(--faint); }
  li.secret .w { color: var(--hot); }
  li.fresh { animation: fresh 1.2s ease-out; }
  @keyframes fresh { from { background: color-mix(in srgb, var(--hot) 14%, transparent); } }
</style>
</head>
<body>

<main id="home" hidden>
  <h1>semantle <span class="roll"><span><i>duel</i></span></span></h1>
  <nav>
    <button data-puzzle="today">today’s word</button>
    <button data-puzzle="random" class="quiet">random</button>
    <a href="/archive" class="quiet">archive</a>
  </nav>
</main>

<main id="archive" hidden>
  <a href="/" class="back">semantle <i>duel</i></a>
  <h3 class="for" hidden>pick a puzzle for the rematch</h3>
  <div class="months"></div>
</main>

<main id="duel" hidden>
  <header>
    <div>
      <div id="clock" class="num">0:00</div>
      <span class="no num"></span><span id="pausebar"></span>
    </div>
    <button id="share" title="copy link">copy link</button>
  </header>
  <div id="banner" hidden></div>
  <nav id="after" hidden></nav>
  <section id="lobby" hidden>
    <div class="who"></div>
    <form id="nameform"><input class="line" id="name" placeholder="your name" maxlength="24" autocomplete="off"></form>
    <button id="go" disabled>start</button>
  </section>
  <ol id="rivals" hidden></ol>
  <section id="board" hidden></section>
</main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const me = store.get("sd-player") || (() => { const id = crypto.randomUUID(); store.set("sd-player", id); return id; })();
const path = location.pathname.split("/").filter(Boolean);

// Never throws: a dropped or stalled request comes back as { ok: false } after 15s at most.
async function post(url, data) {
  try {
    const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data), signal: AbortSignal.timeout(15_000) });
    return { ok: res.ok, ...(await res.json().catch(() => ({}))) };
  } catch {
    return { ok: false, error: "didn’t reach the server" };
  }
}

/* ---------- past duels (this browser only) ---------- */
function pastDuels() {
  try { return JSON.parse(store.get("sd-duels")) || []; } catch { return []; }
}

// Finishers in order: found it (fastest first), then gave up.
function standings(v) {
  return v.players.filter((p) => p.finish).sort((a, b) => (b.finish.found - a.finish.found) || (a.finish.at - b.finish.at));
}

function remember(v) {
  const mine = v.players.find((p) => p.id === me);
  if (!mine) return;
  const others = v.players.filter((p) => p.id !== me).map((p) => p.name);
  const entry = {
    id: v.id, number: v.number, others, status: v.status,
    found: mine.finish?.found ?? null,
    place: v.status === "over" && mine.finish?.found ? standings(v).indexOf(mine) + 1 : null,
    secret: v.secret, time: mine.finish?.time ?? null,
    at: Date.now(),
  };
  const list = [entry, ...pastDuels().filter((d) => d.id !== v.id)].slice(0, 30);
  store.set("sd-duels", JSON.stringify(list));
}

function pastList() {
  const list = pastDuels().filter((d) => d.others.length);
  if (!list.length) return null;
  return el("ol", { class: "past" }, ...list.map((d) => el("li", {},
    el("a", { href: `/d/${d.id}` },
      el("span", { class: "num" }, `#${d.number}`),
      el("span", {}, `vs ${d.others.join(", ")}`),
      el("span", { class: d.place === 1 ? "w" : "" },
        d.found === true ? `${d.place ? ordinal(d.place) : "found"} · ${d.secret} · ${mmss(d.time)}`
        : d.found === false ? `gave up · ${d.secret}`
        : d.status === "lobby" ? "not started" : "in progress"),
    ),
  )));
}

// Rematch a finished duel on this puzzle; whoever asks first sets it up, and everyone lands in the same one.
async function rematch(id, puzzle, button) {
  button.disabled = true;
  const r = await post(`/d/${id}/rematch`, { player: me, puzzle });
  if (r.view?.next) location.href = `/d/${r.view.next}`; else button.disabled = false;
}

async function newDuel(puzzle, button) {
  button.disabled = true;
  const r = await post("/duels", { puzzle });
  if (r.id) location.href = `/d/${r.id}`; else button.disabled = false;
}

/* ---------- title ---------- */
// Guesses warming up to "duel", scored as Semantle would (word2vec cosine × 100).
const NEAR = [["rival", 35.77], ["rematch", 52.04], ["joust", 57.93], ["battle", 65.97], ["tussle", 70.86]];
let rolling = null;

async function rollTitle() {
  const roll = $("#home .roll");
  if (!roll.style.width) roll.style.width = roll.firstElementChild.offsetWidth + "px";
  if (rolling || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  rolling = true;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const card = (w, score) => el("span", {}, el("i", {}, w), score == null ? "" : el("small", {}, score.toFixed(2)));
  await document.fonts?.ready;
  const show = (span, cls) => {
    const old = roll.firstElementChild;
    roll.append(span);
    roll.style.width = span.offsetWidth + "px";
    span.className = cls;
    if (old && cls.startsWith("in")) { old.className = "out"; old.onanimationend = () => old.remove(); }
    else old?.remove();
    return span;
  };
  show(card("duel"), "swipe");
  await wait(1700);
  for (const [w, sc] of NEAR) { show(card(w, sc), "in"); await wait(850); }
  const last = show(card("duel", 100), "in won");
  await wait(1500);
  const n = last.querySelector("small");
  n.style.transition = "opacity .8s"; n.style.opacity = 0;
  await wait(800);
  rolling = null;
}

/* ---------- pages ---------- */
if (path[0] === "d") duelPage(path[1]);
else if (path[0] === "archive") archivePage();
else {
  $("#home").hidden = false;
  rollTitle();
  $("#home h1").onclick = rollTitle;
  const past = pastList();
  if (past) $("#home").append(past);
  for (const b of document.querySelectorAll("#home button")) {
    b.onclick = async () => newDuel(b.dataset.puzzle === "random" ? await randomUnplayed() : undefined, b);
  }
}

// A past puzzle (not today's) that this browser hasn't duelled yet.
async function randomUnplayed() {
  const { number: today } = await (await fetch("/today")).json();
  const played = new Set(pastDuels().map((d) => d.number));
  const fresh = [];
  for (let n = 1; n < today; n++) if (!played.has(n)) fresh.push(n);
  return fresh.length ? fresh[Math.floor(Math.random() * fresh.length)] : 1 + Math.floor(Math.random() * (today - 1));
}

/* ---------- archive ---------- */
async function archivePage() {
  $("#archive").hidden = false;
  const rematchOf = new URLSearchParams(location.search).get("rematch");
  $("#archive .for").hidden = !rematchOf;
  const { number: today } = await (await fetch("/today")).json();
  const played = new Set(pastDuels().map((d) => d.number));
  const dateOf = (n) => new Date(Date.UTC(2022, 0, 29 + n - 1));
  const months = new Map();
  for (let n = today; n >= 1; n--) {
    const d = dateOf(n);
    const key = d.toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
    if (!months.has(key)) months.set(key, []);
    const b = el("button", { class: played.has(n) ? "played" : "", title: played.has(n) ? "played" : "" },
      el("b", { class: "num" }, `#${n}`),
      el("small", {}, d.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" })));
    b.onclick = () => (rematchOf ? rematch(rematchOf, n, b) : newDuel(n, b));
    months.get(key).push(b);
  }
  $("#archive .months").replaceChildren(...[...months].flatMap(([m, bs]) => [el("h3", {}, m), el("div", { class: "grid" }, ...bs)]));
}

/* ---------- duel ---------- */
function duelPage(id) {
  $("#duel").hidden = false;
  const base = `/d/${id}`;
  let view = null, skew = 0, seen = null, draft = "", pending = [];  // pending: my guesses sent but not yet scored
   // seen: guesses already drawn, so only new ones flash
  let recall = null, flashRecall = false;  // a word I'd already guessed: shown up top again, like Semantle does
  let note = null;  // {word, msg}: why my last word didn't count
  let picking = false, today = null;  // rematch: choosing a puzzle
  const open = new Set();  // opponents expanded on a phone
  fetch("/today").then((r) => r.json()).then((t) => (today = t.number)).catch(() => {});

  const join = (name) => post(`${base}/join`, { player: me, name });
  const savedName = store.get("sd-name");
  if (savedName) { $("#name").value = savedName; join(savedName); }

  $("#nameform").onsubmit = (e) => {
    e.preventDefault();
    const name = $("#name").value.trim();
    if (!name) return;
    store.set("sd-name", name);
    join(name);
    $("#name").blur();
  };
  $("#name").onblur = () => $("#nameform").requestSubmit();
  $("#go").onclick = () => post(`${base}/start`, { player: me });
  $("#share").onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); $("#share").textContent = "copied"; }
    catch { $("#share").textContent = location.href; }
    setTimeout(() => ($("#share").textContent = "copy link"), 1600);
  };

  // Live updates. Phones drop these streams silently (sleep, network switch), so the
  // server pings every 15s and we reconnect when it's gone quiet.
  let es = null, heard = 0;
  const connect = () => {
    es?.close();
    heard = Date.now();
    es = new EventSource(`${base}/events?player=${encodeURIComponent(me)}`);
    es.onmessage = (e) => { heard = Date.now(); apply(JSON.parse(e.data)); };
    es.addEventListener("ping", () => (heard = Date.now()));
  };
  connect();
  setInterval(() => Date.now() - heard > 40_000 && connect(), 5_000);
  document.addEventListener("visibilitychange", () => !document.hidden && Date.now() - heard > 20_000 && connect());

  // tell the server we're still here (even from a background tab), so it can stop the
  // clock once everyone racing has actually disconnected
  const racing = () => view?.status === "playing" && view.players.some((p) => p.id === me && !p.finish);
  const here = () => racing() && post(`${base}/here`, { player: me });
  setInterval(here, 10_000);
  document.addEventListener("visibilitychange", here);

  function apply(v) {
    if (view && v.now < view.now) return;  // an older snapshot arriving late
    view = v;
    skew = view.now - Date.now();
    render();
  }

  setInterval(tick, 250);

  function tick() {
    if (!view) return;
    const now = Date.now() + skew;
    const c = $("#clock");
    if (view.status === "lobby") c.textContent = "0:00";
    else if (now < view.startsAt) c.textContent = String(Math.ceil((view.startsAt - now) / 1000));
    else c.textContent = mmss(view.elapsed + (view.status === "playing" && !view.paused ? now - Math.max(view.now, view.startsAt) : 0));
    if (view.status === "countdown" && now >= view.startsAt) { view.status = "playing"; render(); }
  }

  function render() {
    const v = view;
    remember(v);
    $(".no").textContent = `#${v.number}`;
    const inIt = v.players.some((p) => p.id === me);
    const lobby = v.status === "lobby";

    $("#lobby").hidden = !lobby;
    $("#share").hidden = !lobby;
    if (lobby) {
      const who = $("#lobby .who");
      who.replaceChildren(...v.players.map((p) => el("span", { class: p.id === me ? "me" : "" }, p.name)));
      if (v.players.length < v.max) who.append(el("span", { class: "empty" }, "…"));
      $("#nameform").hidden = !inIt && v.players.length >= v.max;
      $("#go").disabled = !(inIt && v.players.length >= 2);
    }

    // your own result, once you have one
    const mine = v.players.find((p) => p.id === me);
    const banner = $("#banner");
    banner.hidden = !mine?.finish;
    if (mine?.finish) {
      const n = mine.guesses.length;
      banner.replaceChildren(...(mine.finish.found
        ? ["you found ", el("b", {}, v.secret), " in ", el("span", { class: "num" }, `${n}`), n === 1 ? " guess" : " guesses"]
        : ["you gave up. it was ", el("b", {}, v.secret)]));
    }
    after(v, mine);
    pausebar(v, mine);

    const board = $("#board");
    board.hidden = lobby;
    if (lobby) return;
    // you first; opponents after, by standing once they finish
    const order = standings(v);
    const rank = (p) => (p.id === me ? -1 : p.finish ? order.indexOf(p) : 99);
    const sides = [...v.players].sort((a, b) => rank(a) - rank(b));
    board.classList.toggle("crowd", sides.length > 2);
    board.classList.toggle("mine", inIt);
    const focused = document.activeElement?.id === "guess";
    board.replaceChildren(...sides.map((p) => side(p, v)));
    const rivals = $("#rivals");
    rivals.hidden = !inIt;
    rivals.replaceChildren(...sides.filter((p) => p.id !== me).map((p) => rival(p, v)));
    seen = new Set(v.players.flatMap((p) => p.guesses.map((g) => `${p.id}:${g.n}`)));
    flashRecall = false;
    if (focused || (v.status === "playing" && inIt && !matchMedia("(hover: none)").matches)) $("#guess")?.focus();
  }

  function pausebar(v, mine) {
    const bar = $("#pausebar");
    const racer = mine && !mine.finish && v.status === "playing";
    $("#clock").classList.toggle("stopped", !!v.paused);
    $("#board").classList.toggle("paused", !!(v.paused && racer));
    const toggle = (label, paused) => {
      const b = el("button", { type: "button" }, label);
      b.onclick = () => post(`${base}/pause`, { player: me, paused }).then((r) => r.view && apply(r.view));
      return b;
    };
    const by = v.paused?.by && v.players.find((p) => p.id === v.paused.by);
    const kids = !v.paused ? (racer ? ["·", toggle("pause", true)] : [])
      : [`· ${!by ? "paused while away" : by.id === me ? "paused" : `${by.name} paused`}`, racer ? toggle("resume", false) : ""];
    bar.replaceChildren(...kids);
  }

  // once you're done: rematch (same opponents, a puzzle of your choosing) or home
  function after(v, mine) {
    const nav = $("#after");
    nav.hidden = !(mine ? mine.finish : v.status === "over");
    if (nav.hidden) return;
    const kids = [];
    if (v.next) kids.push(el("a", { href: `/d/${v.next}`, class: "lead" }, "join the rematch →"));
    else if (mine && v.players.length > 1 && !picking) {
      const b = el("button", { class: "lead", type: "button" }, "rematch");
      b.onclick = () => { picking = true; render(); };
      kids.push(b);
    } else if (mine && v.players.length > 1) {
      const go = (label, puzzle) => {
        const b = el("button", { type: "button" }, label);
        b.onclick = async () => rematch(v.id, await puzzle(), b);
        return b;
      };
      kids.push(el("span", { class: "pick" },
        el("span", {}, "rematch on"),
        go("a random one", randomUnplayed),
        today && today !== v.number ? go("today’s", async () => today) : "",
        el("a", { href: `/archive?rematch=${v.id}` }, "the archive"),
      ));
    }
    kids.push(el("a", { href: "/", class: "quiet" }, "home"));
    nav.replaceChildren(...kids);
  }

  function side(p, v) {
    const mine = p.id === me;
    const best = p.guesses.reduce((m, g) => Math.max(m, g.score), -Infinity);
    const n = p.guesses.length;
    const f = p.finish;
    const place = f?.found ? standings(v).indexOf(p) + 1 : 0;
    const div = el("div", { class: "side" + (mine ? " me" : "") + (f?.found ? " found" : "") + (place === 1 ? " first" : "") });
    div.append(el("h2", {},
      el("span", { class: "name" }, mine ? "you" : p.name),
      el("span", { class: "stat num" },
        f?.found ? `${ordinal(place)} · ${mmss(f.time)} · ${n}`
        : f ? `gave up · ${n}`
        : n ? `${n} · ${best.toFixed(2)}` : ""),
    ));

    if (mine && v.status === "playing" && !f) {
      const form = el("form", {});
      const input = el("input", { class: "line", id: "guess", placeholder: "type a guess", autocomplete: "off", autocapitalize: "off", spellcheck: "false", enterkeyhint: "go" });
      input.value = draft;
      input.oninput = () => (draft = input.value);
      const quit = el("button", { class: "giveup", type: "button" }, "give up");
      quit.onclick = () => {
        if (quit.dataset.sure) return post(`${base}/giveup`, { player: me });
        quit.dataset.sure = 1; quit.textContent = "sure?";
        setTimeout(() => { delete quit.dataset.sure; quit.textContent = "give up"; }, 2500);
      };
      const submit = el("button", { class: "submit", type: "submit" }, "guess");
      submit.onpointerdown = (e) => e.preventDefault();  // keep the keyboard up on phones
      if (v.paused) { input.disabled = true; submit.disabled = true; }
      form.append(input, submit, quit);
      form.onsubmit = async (e) => {
        e.preventDefault();
        const word = input.value.trim().toLowerCase();
        if (!word) return;
        draft = ""; input.value = "";
        note = null; recall = null;
        const known = view.players.find((q) => q.id === me)?.guesses ?? [];
        if (known.some((g) => g.word === word)) { recall = word; flashRecall = true; return render(); }
        if (pending.includes(word)) return render();
        pending.push(word); render();
        const r = await post(`${base}/guess`, { player: me, word });
        pending = pending.filter((w) => w !== word);
        if (r.view) apply(r.view);
        if (!r.ok) {
          if (r.error === "already guessed") { recall = word; flashRecall = true; }
          else note = { word, msg: r.error === "upstream trouble" ? "server hiccup, try again" : r.error ?? "try again" };
        }
        render();
      };
      div.append(form);
    }

    const ol = el("ol", {});
    if (mine) pending = pending.filter((w) => !p.guesses.some((g) => g.word === w));
    if (mine && note && p.guesses.some((g) => g.word === note.word)) note = null;  // it got through after all
    const waiting = mine ? pending : [];
    const again = mine && recall ? p.guesses.find((g) => g.word === recall) : null;
    const told = mine && note && !f;
    if (p.guesses.length || waiting.length || told) ol.append(heads());
    if (told) ol.append(el("li", { class: "note" }, el("span", { class: "n" }, ""), el("span", { class: "w" }, note.word), el("span", { class: "msg" }, note.msg)));
    for (const w of waiting) ol.append(el("li", { class: "pending" }, el("span", { class: "n num" }, ""), el("span", { class: "w" }, w), el("span", { class: "s num" }, "…"), el("span", {})));
    const last = p.guesses.at(-1);
    let sorted = [...p.guesses].sort((a, b) => b.score - a.score);
    // a crowded table keeps opponents short until the end
    const cap = !mine && v.players.length > 2 && v.status !== "over" ? 8 : Infinity;
    const more = sorted.length - cap;
    sorted = sorted.slice(0, cap);
    if (again && !f) ol.append(row(again, p, v, true, flashRecall));
    else if (last && p.guesses.length > 1) ol.append(row(last, p, v, true));
    for (const g of sorted) ol.append(row(g, p, v, false));
    if (more > 0) ol.append(el("li", { class: "more" }, `+${more}`));
    div.append(ol);
    return div;
  }

  // phone: one line per opponent, tap to open their list
  function rival(p, v) {
    const f = p.finish, n = p.guesses.length;
    const best = p.guesses.reduce((b, g) => (!b || g.score > b.score ? g : b), null);
    const last = p.guesses.at(-1);
    const fresh = last && seen !== null && !seen.has(`${p.id}:${last.n}`);
    const place = f?.found ? standings(v).indexOf(p) + 1 : 0;
    const li = el("li", { class: ["rival", open.has(p.id) && "open", fresh && "fresh", place === 1 && "first", f?.found && "found"].filter(Boolean).join(" ") });
    const sum = el("button", { class: "sum", type: "button" },
      el("span", { class: "name" }, p.name),
      el("span", { class: "stat num" }, f?.found ? `${ordinal(place)} · ${mmss(f.time)} · ${n}` : f ? `gave up · ${n}` : n),
      el("span", { class: "s num", style: best ? `color:${heat(best)}` : "" }, best ? best.score.toFixed(2) : ""),
      best ? proximity(best) : el("span", {}),
    );
    sum.onclick = () => { open.has(p.id) ? open.delete(p.id) : open.add(p.id); render(); };
    li.append(sum);
    if (open.has(p.id)) {
      const ol = el("ol", {});
      if (last && n > 1) ol.append(row(last, p, v, true));
      for (const g of [...p.guesses].sort((a, b) => b.score - a.score)) ol.append(row(g, p, v, false));
      li.append(ol);
    }
    return li;
  }

  function row(g, p, v, isLatest, isAgain = false) {
    const fresh = (isLatest || p.guesses.length === 1) && seen !== null && !seen.has(`${p.id}:${g.n}`);
    const li = el("li", { class: [isLatest && "latest", fresh && "fresh", isAgain && "again", v.secret && g.word === v.secret && "secret"].filter(Boolean).join(" ") });
    const word = g.word ?? "x".repeat(4 + ((g.n * 7 + p.id.charCodeAt(0)) % 6));
    li.append(
      el("span", { class: "n num" }, g.n),
      el("span", { class: "w" + (g.word ? "" : " hidden") }, word),
      el("span", { class: "s num", style: `color:${heat(g)}` }, g.score.toFixed(2)),
      proximity(g),
    );
    return li;
  }
}

// Semantle's proximity column: rank out of 1000 with a bar, or a temperature word.
function proximity(g) {
  if (g.rank === 1000) return el("span", { class: "p found" }, "🔥🎉");
  if (g.rank) {
    const p = el("span", { class: "p num" }, el("span", {}, `${g.rank}/1000`), el("span", { class: "bar" }, el("i", { style: `width:${g.rank / 10}%;background:hsl(${Math.round((g.rank / 1000) * 125)} 68% 46%)` })));
    return p;
  }
  return el("span", { class: "p temp" }, g.score < 0 ? "(far)" : g.score < 20 ? "(cold)" : "(tepid)");
}

function heat(g) {
  if (g.rank) return "var(--hot)";
  if (g.score >= 20) return "var(--warm)";
  return "var(--faint)";
}

function heads() {
  return el("li", { class: "heads" }, el("span", {}, "#"), el("span", {}, "Guess"), el("span", { class: "s" }, "Similarity"), el("span", {}, "Proximity"));
}

function ordinal(n) {
  return n + (["th", "st", "nd", "rd"][n] ?? "th");
}

function mmss(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return (h ? `${h}:${String(m).padStart(2, "0")}` : `${m}`) + `:${String(r).padStart(2, "0")}`;
}

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== "" && v != null) e.setAttribute(k, v);
  e.append(...kids.map((k) => (typeof k === "number" ? String(k) : k)));
  return e;
}
</script>
</body>
</html>
