<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>semantle duel</title>
<!-- the "s" of the title, traced from Georgia so it looks the same where Georgia isn't installed -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-130 -1065 1141 1141'><path fill='%23d4471f' transform='scale(1 -1)' d='M723 483Q764 447 786 400Q808 353 808 285Q808 148 705.5 61Q603 -26 440 -26Q354 -26 281.5 5Q209 36 178 62L158 -3H83L73 340H142Q150 301 176 249Q202 197 239 155Q278 111 332.5 81Q387 51 455 51Q551 51 603 94.5Q655 138 655 219Q655 261 638.5 291.5Q622 322 590 345Q557 368 509 386.5Q461 405 402 423Q355 437 297.5 461.5Q240 486 199 519Q155 554 127 605Q99 656 99 725Q99 846 189 930Q279 1014 430 1014Q488 1014 548.5 999Q609 984 647 963L670 1015H742L757 698H688Q667 804 597.5 870.5Q528 937 428 937Q346 937 299 896Q252 855 252 797Q252 752 267.5 722Q283 692 314 671Q344 651 389.5 633.5Q435 616 502 594Q568 573 626.5 545Q685 517 723 483Z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f3ec; --ink: #1d1b18; --faint: #8b857a; --rule: #ddd6c8;
    --serif: "EB Garamond", Garamond, Georgia, serif;
    --hot: #d4471f; --warm: #d98b2b; --cool: #6b8fa3; --you: #1d1b18;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #15140f; --ink: #ece6d8; --faint: #7e786c; --rule: #2c2a24; --you: #ece6d8; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { font-size: 110%; }  /* everything sized in rem scales with this */
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 1.125rem/1.35 var(--serif); font-variant-numeric: lining-nums; min-height: 100dvh; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  /* home */
  #home { min-height: calc(100dvh - 2rem); display: grid; place-content: center; gap: 2.5rem; padding: 16px; text-align: center; }
  #home h1 { font: 400 clamp(2.4rem, 9vw, 4.5rem)/1 Georgia, "Times New Roman", serif; letter-spacing: -.02em; margin: 0; }
  #home h1 i { color: var(--hot); }
  #home h1 { white-space: nowrap; cursor: default; -webkit-tap-highlight-color: transparent; }
  /* the title's last word: flips through guesses near "duel", then lands on it. Its width stays
     pinned to "duel" so "semantle" holds still; longer guesses spill to the right. */
  .roll { position: relative; display: inline-block; vertical-align: bottom; height: 1.2em; margin-bottom: -.12em; perspective: 4em; text-align: left; }
  .roll > span { position: absolute; left: 0; bottom: .12em; white-space: nowrap; font-style: italic; color: var(--hot); backface-visibility: hidden; transform-origin: 50% 50% -.4em; }
  .roll > span.won small { color: var(--hot); }
  .roll > span small { position: absolute; right: -.9em; top: 100%; margin-top: .05em; font: 400 .8rem/1 var(--serif); font-style: normal; color: var(--faint); font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .roll > span.in { animation: flipin .5s cubic-bezier(.3,.7,.2,1) both; }
  .roll > span.out { animation: flipout .5s cubic-bezier(.5,0,.8,.4) both; }
  .roll > span.swipe { animation: swipe .7s cubic-bezier(.2,.8,.2,1) both; }
  #home h1 .lead { display: inline-block; animation: swipe .8s cubic-bezier(.2,.8,.2,1) .5s both; }
  @keyframes flipin { from { transform: rotateX(90deg); opacity: 0; } }
  @keyframes flipout { to { transform: rotateX(-90deg); opacity: 0; } }
  @keyframes swipe { from { clip-path: inset(-.5em 100% -.5em 0); transform: translateX(.6em); opacity: 0; } to { clip-path: inset(-.5em -1em -.5em 0); } }
  @media (prefers-reduced-motion: no-preference) { .roll > span:not([class]) { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .roll > span, #home h1 .lead { animation: none !important; } }
  #home nav { display: flex; flex-wrap: wrap; gap: .8rem 2rem; justify-content: center; }
  #setword { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: baseline; justify-content: center; }
  #setword input { width: 11em; font-size: 1.15rem; text-align: center; }
  #setword button { white-space: nowrap; font-size: 1.15rem; border-bottom: 2px solid var(--hot); padding-bottom: 1px; }
  #setword .why { flex-basis: 100%; text-align: center; color: var(--hot); font-style: italic; font-size: .95rem; }
  #setword .why:empty { display: none; }
  #home nav button { font-size: 1.15rem; border-bottom: 1.5px solid currentColor; padding-bottom: 2px; }
  #home nav button, #home nav a { font-size: 1.15rem; border-bottom: 1.5px solid currentColor; padding-bottom: 2px; color: inherit; text-decoration: none; }
  #home nav .quiet { color: var(--faint); }

  /* archive */
  #archive { max-width: 640px; margin: 0 auto; padding: 22px 16px 60px; }
  #archive .back { font: 400 1.6rem/1 var(--serif); color: inherit; text-decoration: none; }
  #archive .back i { color: var(--hot); }
  #archive h3 { font: 400 1.05rem var(--serif); color: var(--faint); margin: 2rem 0 .5rem; }
  #archive .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr)); gap: 2px 6px; }
  #archive .grid button { text-align: left; padding: .4rem .2rem; border-bottom: 1px solid var(--rule); display: grid; }
  #archive .grid button:hover { border-color: var(--ink); }
  #archive .grid b { font-weight: 400; }
  #archive .grid small { color: var(--faint); font-size: .72rem; }
  #archive .grid button.played b { color: var(--hot); }
  #home .past { margin: 1rem auto 0; padding: 0; list-style: none; text-align: left; font-size: .9rem; width: min(100%, 26rem); }
  #home .past li { display: block; padding: 0; border: 0; }
  #home .open h3 { font: italic 400 .9rem var(--serif); color: var(--faint); margin: 0 auto .2rem; width: min(100%, 26rem); text-align: left; }
  #home .open .past { margin-top: 0; }
  #home .past a { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: .8rem; padding: .35rem 0; color: var(--faint); text-decoration: none; border-bottom: 1px solid var(--rule); }
  #home .past a:hover { color: var(--ink); }
  #home .past .w { color: var(--hot); }

  /* duel */
  #duel { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  header .no { color: var(--faint); text-decoration: none; border-bottom: 1px dotted var(--faint); }
  header .no:hover { color: var(--ink); }
  header .no:not([href]) { border: 0; }  /* a new or set word: nothing on semantle.com to link to */
  header .no:not([href]):hover { color: var(--faint); }
  #clock.stopped { color: var(--faint); }
  #pausebar { color: var(--faint); font-size: .95rem; margin-left: .5em; }
  #pausebar button { color: var(--ink); border-bottom: 1px solid currentColor; margin-left: .3em; }
  #pausebar .ask { color: var(--hot); }
  #board.paused .side.me ol, #board.paused #guess { filter: blur(6px); pointer-events: none; }
  .side form.slot { visibility: hidden; }
  .side form .submit { font-size: 1.05rem; border-bottom: 2px solid var(--hot); padding-bottom: 1px; }
  .side form .submit:disabled { color: var(--faint); border-color: var(--rule); cursor: default; }
  #clock { font: 400 clamp(2.6rem, 10vw, 4rem)/1 var(--serif); letter-spacing: -.02em; }
  #voice { margin-top: .5rem; color: var(--faint); font-size: 1rem; display: flex; flex-wrap: wrap; gap: .2rem .7rem; align-items: baseline; }
  #voice button { color: var(--faint); border-bottom: 1px dotted var(--faint); }
  #voice button:hover { color: var(--ink); }
  #voice button.call { color: var(--hot); border-bottom: 1.5px solid var(--hot); }
  #voice .who { color: var(--ink); }
  #voice .who span { transition: color .15s; }
  #voice .who .talking { color: var(--hot); }
  #voice .who .muted, #voice .who .off { color: var(--faint); }
  #voice .err { color: var(--hot); font-style: italic; }
  #watch { margin-top: 1rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem 1rem; font-size: 1.1rem; }
  #watch span { color: var(--faint); font-style: italic; }
  #watch input { width: 9em; }
  #watch .go { border-bottom: 2px solid var(--hot); padding-bottom: 1px; }
  #share { color: var(--faint); font-size: 1rem; border-bottom: 1px dotted var(--faint); }
  #banner { font: 400 1.5rem/1.2 var(--serif); margin: 1.4rem 0 .4rem; }
  #banner b { color: var(--hot); font-weight: 400; }

  #lobby { margin-top: 2.2rem; display: grid; gap: 1.6rem; }
  #lobby .who { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; font-size: 1.3rem; }
  #lobby .who span.me { text-decoration: underline; text-underline-offset: 4px; }
  #lobby .who .others { display: contents; }
  #mine { display: inline-flex; align-items: baseline; gap: .3em; }
  #mine input { font-size: inherit; width: 8em; }
  #mine .joinbtn { margin-left: .5em; border-bottom: 2px solid var(--hot); padding-bottom: 1px; }
  #mine .pencil { color: var(--faint); align-self: center; display: grid; }
  #mine .pencil:hover { color: var(--ink); }
  #mine .pencil svg { width: .8em; height: .8em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #lobby .who span.empty { color: var(--faint); }
  #lobby .who .away { color: var(--faint); }
  #lobby .who .away small { font-style: italic; font-size: .7em; }
  #lobby .who .ok { color: var(--hot); font-size: .8em; margin-left: .25em; }
  #lobby .who .me .ok { display: inline-block; }  /* out of the name's underline */
  #lobby .wait { color: var(--faint); font-style: italic; margin-left: 1rem; }
  #lobby form { display: flex; gap: 1rem; align-items: baseline; }
  #go { font: 400 1.6rem var(--serif); border-bottom: 2px solid var(--hot); justify-self: start; }
  #go.on { color: var(--faint); border-color: var(--rule); }
  #go[disabled] { color: var(--faint); border-color: var(--rule); cursor: default; }

  input.line { -webkit-appearance: none; appearance: none; border-radius: 0; background: none; border: 0; border-bottom: 1.5px solid var(--ink); padding: 4px 0; outline: none; min-width: 0; }
  input.line::placeholder { color: var(--faint); }

  #board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.4rem; margin-top: 1.6rem; align-items: start; }
  #board.crowd { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); row-gap: 1.6rem; }
  #board .others { display: grid; gap: 1.6rem; align-content: start; min-width: 0; }
  #board .others .side { font-size: .82rem; }
  #board .others .side li.heads { display: none; }
  #board .others .side h2 { font-size: 1.05rem; }
  #rivals { display: none; }
  @media (max-width: 700px) {
    /* minmax(0, …): a bare 1fr would grow to its widest row and run off the screen */
    #board, #board.crowd { grid-template-columns: minmax(0, 1fr); gap: 2rem; margin-top: 1.2rem; }
    #board.mine .side:not(.me), #board.mine .others { display: none; }
    /* narrower columns, so the word itself has room */
    #duel li { grid-template-columns: 1.6em minmax(0, 1fr) 3.9em 6.6em; gap: .5em; }
    /* everyone else in one strip, a line high however many: leader first, sideways if it overflows */
    #rivals:not([hidden]) { display: block; margin: .9rem 0 0; }
    #rivals .strip { display: flex; gap: 1.2rem; overflow-x: auto; scrollbar-width: none; white-space: nowrap; padding: .2rem 0 .4rem; border-bottom: 1px solid var(--rule); }
    #rivals .strip::-webkit-scrollbar { display: none; }
    .chip { flex: none; display: inline-flex; align-items: baseline; gap: .35em; padding-bottom: 2px; border-bottom: 2px solid transparent; }
    .chip.on { border-color: var(--ink); }
    .chip .name { font-size: 1.05rem; }
    .chip.first .name { color: var(--hot); }
    .chip .s { font-size: .9rem; }
    .chip .mark { font-size: .78rem; color: var(--faint); }
    .chip.found .mark { color: var(--hot); }
    #rivals .open ol { font-size: .92em; margin: .2em 0 0; }
    #rivals .open:not(:empty) { border-bottom: 1px solid var(--rule); }
    #rivals .open ol li:last-child { border-bottom: 0; }
  }
  .side h2 { font: 400 1.25rem/1.2 var(--serif); margin: 0 0 .2rem; display: flex; justify-content: space-between; align-items: baseline; }
  .side h2 .stat { font-size: .9rem; color: var(--faint); }
  .side.found h2 .stat { color: var(--hot); }
  .side.first h2 .name { color: var(--hot); }
  .side form { display: flex; align-items: baseline; gap: 1rem; }
  .giveup { font-size: .8rem; color: var(--faint); white-space: nowrap; }
  .giveup[data-sure] { color: var(--hot); }
  li.more { display: block; color: var(--faint); font-size: .85em; border: 0; }
  .side form { margin: .6rem 0 .3rem; position: relative; }
  .side form input { flex: 1; font-size: 1.15rem; }
  #guess { border-bottom-width: 2px; }
  #guess:focus { border-bottom-color: var(--hot); }
  li.note { color: var(--faint); }
  li.note .msg { grid-column: 3 / 5; color: var(--hot); font-size: .85em; font-style: italic; }
  li.again { animation: again 1.6s ease-out; }
  @keyframes again { from { background: color-mix(in srgb, var(--warm) 22%, transparent); } }

  #after { display: flex; flex-wrap: wrap; align-items: baseline; gap: .6rem 1.6rem; margin: .2rem 0 .4rem; font-size: 1.1rem; }
  #after a, #after button { color: inherit; text-decoration: none; border-bottom: 1.5px solid currentColor; padding-bottom: 1px; }
  #after .lead { border-bottom: 2px solid var(--hot); }
  #after .quiet { color: var(--faint); }
  #after .pick { display: contents; }
  #after .pick span { color: var(--faint); }
  #tally { margin: .3rem 0 .6rem; color: var(--faint); font-size: .95rem; display: grid; gap: .15rem; }
  #tally b { font-weight: 400; color: var(--ink); }
  #tally .lead b { color: var(--hot); }

  ol { list-style: none; margin: .5em 0 0; padding: 0; }
  li { display: grid; grid-template-columns: 2em minmax(0, 1fr) 4.6em 8em; align-items: center; gap: .6em; padding: .32em 0; border-bottom: 1px solid var(--rule); }
  li.heads { color: var(--faint); border-bottom-color: var(--ink); padding-top: 0; }
  li.heads span { font-size: .75em; }
  li.heads .sortby { all: unset; display: block; cursor: pointer; white-space: nowrap; }  /* the whole cell takes the click, not just a "#" */
  li.heads .sortby:hover, li.heads .sortby.on { color: var(--ink); }
  li.heads .sortby:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  li.heads .sortby i { font-style: normal; margin-left: .2em; }
  li.latest { border-bottom: 1.5px solid var(--ink); margin-bottom: .5em; }
  li .n { color: var(--faint); font-size: .8em; }
  li.shared .n { color: var(--ink); font-weight: 600; }  /* someone else guessed it too */
  li .w small { color: var(--hot); font-size: .72em; font-style: italic; margin-left: .35em; }
  li.check .w { font-style: italic; }
  /* a guess being scored: your word as you typed it, in full ink; only the score waits */
  li.pending .s { color: var(--faint); }
  li .w { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .w.hidden { filter: blur(5px); user-select: none; color: var(--faint); }
  li .s { text-align: right; }
  li .p { font-size: .85em; white-space: nowrap; }
  li .p.num { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: .4em; }
  li .p .bar { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
  li .p .bar i { display: block; height: 100%; background: var(--hot); }
  li .p.temp { color: var(--faint); }
  li.secret .w { color: var(--hot); }
  li.missed .w, li.missed .s { color: var(--faint); }
  /* someone else's new guess: a highlight that swells in, then fades */
  li.fresh, .chip.fresh { animation: fresh 1.4s ease-in-out; }
  @keyframes fresh { 0%, 100% { background: transparent; } 18% { background: color-mix(in srgb, var(--hot) 12%, transparent); } }
  /* your own guess landing: only the new information arrives, the score fading in and the bar growing */
  li.landed .s, li.landed .p { animation: land .18s ease-out both; }
  li.landed .p .bar i { animation: grow .45s cubic-bezier(.2,.7,.3,1) both; transform-origin: left; }
  @keyframes land { from { opacity: 0; } }
  @keyframes grow { from { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { li.fresh, .chip.fresh, li.landed .s, li.landed .p, li.landed .p .bar i { animation: none; } }

  /* compete or collab, chosen before a round */
  .modes { display: inline-flex; gap: .9rem; align-items: baseline; }
  #lobby .modes button, #after .modes button { color: var(--faint); border-bottom: 1.5px solid transparent; padding-bottom: 1px; }
  #lobby .modes button[aria-pressed="true"], #after .modes button[aria-pressed="true"] { color: var(--ink); border-color: var(--hot); }
  .modes button:disabled { cursor: default; }
  /* a co-op round: one board, with a column for who guessed each word */
  #board.together { grid-template-columns: minmax(0, 38rem); }
  #board.together li { grid-template-columns: 2em minmax(0, 1fr) 5em 4.6em 8em; }
  #board.together li .s { grid-column: 4; }
  #board.together li .p { grid-column: 5; }
  #board.together li.note .msg { grid-column: 3 / 6; }
  #board.together .by { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board.together li:not(.heads) .by { color: var(--faint); font-size: .85em; }
  .lasts { display: flex; flex-wrap: wrap; gap: .1rem 1rem; color: var(--faint); font-size: .9rem; margin: .1rem 0 .3rem; }
  .lasts b { font-weight: 400; color: var(--ink); }
  @media (max-width: 700px) {
    /* five columns on a phone: the bar goes, so the word keeps its room */
    #board.together li { grid-template-columns: 1.4em minmax(0, 1fr) 2.9em 3.4em 3.7em; gap: .4em; }
    #board.together li .p .bar { display: none; }
  }

  /* feedback */
  #top { display: flex; align-items: baseline; padding: .7rem 16px 0; max-width: 980px; margin: 0 auto; }
  #top #bug { margin-left: auto; }
  #top .logo { font: 400 1.6rem/1 Georgia, "Times New Roman", serif; letter-spacing: -.02em; color: inherit; text-decoration: none; }
  #top .logo i { color: var(--hot); }
  @media (max-width: 380px) { #top .logo { font-size: 1.35rem; } }
  #top button { color: var(--faint); font-size: 1.15rem; font-style: italic; border-bottom: 1px dotted var(--faint); }
  #report { border: 0; padding: 0; background: transparent; color: var(--ink); max-width: none; max-height: none; }
  #report::backdrop { background: color-mix(in srgb, var(--paper) 55%, transparent); backdrop-filter: blur(3px); }
  #report form { background: var(--paper); border: 1px solid var(--rule); box-shadow: 0 10px 40px rgb(0 0 0 / .18); width: min(30rem, calc(100vw - 32px)); padding: 1.3rem 1.3rem 1.1rem; display: grid; gap: .9rem; }
  #report h2 { font: 400 1.35rem/1.1 var(--serif); margin: 0; display: flex; gap: .9rem; align-items: baseline; }
  #report h2 button { color: var(--faint); border-bottom: 1.5px solid transparent; }
  #report h2 button[aria-pressed="true"] { color: var(--ink); border-color: var(--hot); }
  #report textarea { font: inherit; color: inherit; background: none; border: 1px solid var(--rule); border-radius: 2px; resize: vertical; min-height: 6.5em; padding: .5em .65em; outline: none; -webkit-appearance: none; }
  #report textarea:focus { border-color: var(--faint); }
  #report textarea::placeholder { color: var(--faint); font-style: italic; }
  /* like Nertz's: a dashed drop box, then a thumbnail with a bin on its corner */
  #report .attach { display: block; padding: .5rem .6rem; border: 1.5px dashed var(--faint); border-radius: 8px; text-align: center; color: var(--faint); cursor: pointer; font-size: .95rem; }
  #report .attach:hover { color: var(--ink); border-color: var(--ink); }
  #report .attach small { font-style: italic; }
  #report svg { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #report .attach svg { margin-right: .35em; vertical-align: -.2em; }
  #report .shot { position: relative; width: max-content; }
  #report .shot img { display: block; width: 96px; max-height: 64px; object-fit: cover; border: 1.5px solid var(--ink); border-radius: 6px; }
  #report .unshot { position: absolute; top: -8px; right: -8px; display: grid; place-items: center; width: 26px; height: 26px; border: 1.5px solid var(--ink); border-radius: 99px; background: var(--paper); }
  #report .unshot svg { width: 15px; height: 15px; }
  #report .acts { display: flex; gap: 1.4rem; align-items: baseline; justify-content: flex-end; }
  #report .acts .send { font-size: 1.1rem; color: var(--hot); }
  #report .acts .send:disabled { color: var(--faint); }
  #report .acts .cancel { color: var(--faint); }
  #report .said { color: var(--hot); font-style: italic; margin-right: auto; }
  /* sent: the whole slip becomes a thank-you, then closes */
  #report form.sent > :not(.thanks) { visibility: hidden; }
  #report form.sent { position: relative; }
  #report .thanks { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; font: italic 400 2.6rem/1 var(--serif); color: var(--hot); }
  #report form:not(.sent) .thanks { display: none; }
  @media (max-width: 560px) {
    #report { margin: auto 0 0; width: 100%; }

<script>
const $ = (s, el = document) => el.querySelector(s);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
// History from before the 2026-11-21 clear-out points at rounds that no longer exist: forget it.
try { localStorage.removeItem("sd-duels"); localStorage.removeItem("sd-made"); } catch {}
const me = store.get("sd-player") || (() => { const id = crypto.randomUUID?.() ?? [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, "0")).join(""); store.set("sd-player", id); return id; })();
const path = location.pathname.split("/").filter(Boolean);

// Never throws: a dropped or stalled request comes back as { ok: false } after 15s at most.
async function post(url, data) {
  try {
    const res = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data), signal: AbortSignal.timeout(15_000) });
    return { ok: res.ok, ...(await res.json().catch(() => ({}))) };
  } catch {
    return { ok: false, error: "didn’t reach the server" };
  }
}

/* ---------- past duels (this browser only) ---------- */
function pastDuels() {
  try { return JSON.parse(store.get("sd-history")) || []; } catch { return []; }
}

// Finishers in order: found it (fastest first), then gave up.
function standings(v) {
  return v.players.filter((p) => p.finish).sort((a, b) => (b.finish.found - a.finish.found) || (a.finish.at - b.finish.at));
}

function remember(v) {
  const mine = v.players.find((p) => p.id === me);
  if (!mine) return;
  const others = v.players.filter((p) => p.id !== me).map((p) => p.name);
  const entry = {
    id: v.id, room: v.room ?? v.id, number: v.number, mode: v.mode, others, status: v.status,
    found: mine.finish?.found ?? null,
    place: v.status === "over" && !v.collab && mine.finish?.found ? standings(v).indexOf(mine) + 1 : null,  // co-op has no places, so no wins
    secret: v.secret, time: mine.finish?.time ?? null,
    at: Date.now(),
  };
  const list = [entry, ...pastDuels().filter((d) => d.id !== v.id)].slice(0, 200);
  store.set("sd-history", JSON.stringify(list));
}

// Your rooms (this browser's), most recent first: { room, others, rounds (started, newest first) }.
function myRooms() {
  const by = new Map();
  for (const d of pastDuels()) {
    const room = d.room ?? d.id;
    if (!by.has(room)) by.set(room, { room, others: new Set(), rounds: [], at: 0 });
    const r = by.get(room);
    d.others.forEach((n) => r.others.add(n));
    r.at = Math.max(r.at, d.at);
    if (d.status !== "lobby") r.rounds.push(d);  // a round that never started isn't history
  }
  for (const r of by.values()) r.rounds.sort((a, b) => b.at - a.at);
  return [...by.values()].sort((a, b) => b.at - a.at);
}

// Where each of your rooms is now (its current round), so rooms that lead to the same round count as one
// (rounds from before rooms existed are each their own "room", but their rematches lead on to the same one).
async function roomsNow() {
  const rooms = myRooms().slice(0, 40);
  const heads = await Promise.all(rooms.map((r) =>
    fetch(`/d/${r.room}/head?player=${encodeURIComponent(me)}`).then((x) => x.json()).catch(() => null)));
  const merged = new Map();  // head's room (or the room itself) -> room
  rooms.forEach((r, i) => {
    const h = heads[i]?.id ? heads[i] : null, key = h?.room ?? h?.id ?? r.room;
    const m = merged.get(key);
    if (!m) return merged.set(key, { ...r, room: h?.room ?? r.room, others: new Set(r.others), h });
    r.others.forEach((n) => m.others.add(n));
    m.rounds = [...m.rounds, ...r.rounds].sort((a, b) => b.at - a.at);
    m.at = Math.max(m.at, r.at);
  });
  return [...merged.values()].sort((a, b) => b.at - a.at);
}

// One line per room you've played in: who, how many rounds, your wins, and how the latest went.
function pastList(rooms) {
  rooms = rooms.filter((r) => r.rounds.length && r.others.size);
  if (!rooms.length) return null;
  return el("ol", { class: "past" }, ...rooms.map((r) => {
    const d = r.rounds[0], wins = r.rounds.filter((x) => x.place === 1).length, n = r.rounds.length;
    return el("li", {},
      el("a", { href: `/d/${r.room}` },
        el("span", {}, `vs ${[...r.others].join(", ")}`),
        el("span", { class: "num" }, `${n} ${n === 1 ? "round" : "rounds"}${wins ? ` · ${wins} won` : ""}`),
        el("span", { class: d.place === 1 ? "w" : "" },
          d.found === true ? `${d.place ? ordinal(d.place) : "found"} · ${d.secret}`
          : d.found === false ? `gave up · ${d.secret}` : "in progress"),
      ),
    );
  }));
}

// Your rooms with something on: a lobby with someone there, or a round you're racing that someone has open
// or has moved in lately (a round left mid-race long ago isn't "open").
const STALE_MS = 2 * 3600_000;
function openList(rooms) {
  const seen = new Set();
  const open = rooms.filter((r) => {
    const h = r.h;
    if (!h || seen.has(h.id)) return false;
    const on = (h.status === "lobby" && h.here > 0) || (h.racing && (h.here > 0 || h.idle < STALE_MS));
    if (on) seen.add(h.id);
    return on;
  });
  if (!open.length) return null;
  return el("div", { class: "open" }, el("h3", {}, "open now"), el("ol", { class: "past" }, ...open.map((r) => el("li", {},
    el("a", { href: `/d/${r.room}` },
      el("span", {}, r.others.size ? `vs ${[...r.others].join(", ")}` : "your room"),
      el("span", {}, ""),
      el("span", { class: "w" }, r.h.racing ? "you’re mid-race →" : `lobby · ${r.h.here} here →`),
    ),
  ))));
}

async function rematch(id, puzzle, button, mode, collab) {

async function rollTitle() {
  const roll = $("#home .roll");
  if (rolling || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  rolling = true;
  // Background tabs don't run CSS animations, so the roll holds still while the tab is hidden
  // and picks up where it left off when it's back.
  const visible = () => document.hidden && new Promise((r) => document.addEventListener("visibilitychange", function on() {
    if (!document.hidden) { document.removeEventListener("visibilitychange", on); r(); }
  }));
  const wait = async (ms) => { await visible(); await new Promise((r) => setTimeout(r, ms)); await visible(); };
  const card = (w, score) => el("span", {}, el("i", {}, w), score == null ? "" : el("small", {}, score.toFixed(2)));
  await document.fonts?.ready;
  if (!roll.style.width) roll.style.width = roll.firstElementChild.offsetWidth + "px";
  const show = (span, cls) => {
    // Only the word on show may leave; anything still on its way out goes now, so words never pile up
    // (an "out" word waits on animationend, which never comes if the animation didn't run).
    const old = roll.lastElementChild;
    for (const s of [...roll.children]) if (s !== old) s.remove();
    roll.append(span);
    span.className = cls;
    if (old && cls.startsWith("in")) { old.className = "out"; old.onanimationend = () => old.remove(); }
    else old?.remove();
    return span;
  };
  if (!rolled) await wait(1400);  // "semantle" sweeps in first, on load only
  rolled = true;
  show(card("…"), "swipe");
  await wait(1100);
  // Five that fit between the title and the screen's edge, no two sharing a stem ("battle"/"battles") or a score.
  // Measured by rendering each word in a hidden card, so it's the title's real font and size.
  const room = innerWidth - roll.getBoundingClientRect().left - 16;
  const probe = roll.appendChild(el("span", { class: "probe", style: "visibility: hidden" }, el("i", {})));
  const pool = NEAR.filter(([w]) => ((probe.firstChild.textContent = w), probe.offsetWidth <= room));
  probe.remove();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const picks = [], stems = new Set(), scores = new Set();
  for (const [w, sc] of pool) {
    if (picks.length === 5) break;
    if (stems.has(w.slice(0, 5)) || scores.has(sc)) continue;
    picks.push([w, sc]); stems.add(w.slice(0, 5)); scores.add(sc);
  }
  picks.sort((a, b) => a[1] - b[1]);
  for (const [i, [w, sc]] of picks.entries()) { show(card(w, sc), "in"); await wait(1250); }
  const last = show(card("duel", 100), "in won");
  await wait(1500);
  const n = last.querySelector("small");
  n.style.transition = "opacity .8s"; n.style.opacity = 0;
  await wait(800);
  rolling = null;
}

{

  let image = null;

  const setImage = (url) => { image = url; shot.hidden = !url; attachLink.hidden = !!url; if (url) $("img", shot).src = url; };
  const shrink = async (file) => {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = Object.assign(document.createElement("canvas"), { width: Math.round(bmp.width * scale), height: Math.round(bmp.height * scale) });
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close();
    return c.toDataURL("image/jpeg", 0.82);
  };
  const attach = async (file) => {
    if (!file?.type.startsWith("image/")) return;
    try { setImage(await shrink(file)); } catch { said.textContent = "couldn’t read that picture"; }
  };
  const imageIn = (files) => [...files].find((f) => f.type.startsWith("image/"));
  $("input", attachLink).onchange = (e) => { attach(e.target.files[0]); e.target.value = ""; };
  $("#report .unshot").onclick = () => setImage(null);
  d.addEventListener("paste", (e) => { const f = imageIn(e.clipboardData.files); if (f) { e.preventDefault(); attach(f); } });
  d.addEventListener("dragover", (e) => e.preventDefault());
  d.addEventListener("drop", (e) => { e.preventDefault(); attach(imageIn(e.dataTransfer.files)); });
  d.onclick = (e) => { if (e.target === d) d.close(); };  // tap outside (braces: an onclick returning false would cancel the send)
  $("#report form").onsubmit = async (e) => {
    e.preventDefault();
    if (!ta.value.trim()) return ta.focus();
    send.disabled = true; said.textContent = "sending…";
    const v = currentView;
    const r = await post("/feedback", {
      kind, text: ta.value, player: me, name: store.get("sd-name") ?? "", image,
      context: {
        page: location.pathname + location.search, room: v ? v.room ?? v.id : undefined, duel: v?.id, number: v?.number, mode: v?.mode, status: v?.status,
        guesses: v?.players.find((p) => p.id === me)?.guesses.length,
        browser: navigator.userAgent, screen: `${innerWidth}×${innerHeight} @${devicePixelRatio}x ${matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"}`,
        errors,
      },
    });
    if (!r.ok) { said.textContent = r.error ?? "didn’t send, try again"; send.disabled = false; return; }
    said.textContent = "";
    ta.value = "";
    setImage(null);
    const form = $("#report form");
    form.classList.add("sent");
    $("#report .thanks").hidden = false;
    setTimeout(() => { d.close(); form.classList.remove("sent"); }, 1300);
  };
}

/* ---------- voice chat ---------- */
// An audio-only WebRTC mesh between the duel's players who pressed "join voice", as in Nertz: every
// pair has one RTCPeerConnection. Who is in voice comes with each view (`voice`); offers, answers and
// ICE candidates go up as POST /signal and come down the event stream (`event: signal`), the sender
// stamped by the server. Of two players the one with the smaller id makes the offer, so offers never cross.
// STUN only: two players both behind strict NATs won't hear each other (that would need a TURN relay).
const ICE_SERVERS = [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302", "stun:stun.cloudflare.com:3478"] }];

function voiceChat(base, changed) {
  const st = { status: "off", muted: false, error: null, speaking: new Set(), links: new Map() };
  const peers = new Map();  // id -> { pc, audio, queued }
  const meters = new Map(); // id -> { node, source }
  let mic = null, ctx = null, timer = null, asks = 0;
  const signal = (to, data) => post(`${base}/signal`, { player: me, to, data: JSON.stringify(data) });
  const tell = () => post(`${base}/voice`, { player: me, on: st.status === "on", muted: st.muted });

  async function join() {
    if (st.status !== "off") return;
    st.status = "asking"; st.error = null; changed();
    const ask = ++asks;
    let made = null;
    try { made = new AudioContext(); } catch {}  // made inside the click, so audio may play; only for who's speaking
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch {
      made?.close();
      if (ask === asks && st.status === "asking") { st.status = "off"; st.error = "no microphone: check the browser’s permission"; changed(); }
      return;
    }
    if (ask !== asks || st.status !== "asking") { for (const t of stream.getTracks()) t.stop(); made?.close(); return; }
    mic = stream; ctx = made; ctx?.resume();
    for (const t of mic.getAudioTracks()) t.enabled = !st.muted;
    meter(me, mic);
    timer = setInterval(measure, 120);
    st.status = "on"; changed();
    const r = await tell();
    if (!r.ok) { leave(false); st.error = r.error ?? "couldn’t join voice"; changed(); }
  }

  function leave(say = true) {
    if (st.status === "off") return;
    asks++;
    for (const id of [...peers.keys()]) close(id);
    for (const t of mic?.getTracks() ?? []) t.stop();
    mic = null;
    clearInterval(timer);
    for (const m of meters.values()) m.source.disconnect();
    meters.clear();
    ctx?.close(); ctx = null;
    const was = st.status;
    st.status = "off"; st.speaking = new Set(); changed();
    if (say && was === "on") tell();
  }

  function setMuted(muted) {
    st.muted = muted;
    for (const t of mic?.getAudioTracks() ?? []) t.enabled = !muted;
    changed();
    if (st.status === "on") tell();
  }

  // The server said who's in voice: connect to whoever is new, drop whoever has gone.
  function sync(members = []) {
    if (st.status !== "on") return;
    if (!members.some((m) => m.id === me)) {
      // the server lost us (the event stream dropped and came back): say so again
      for (const id of [...peers.keys()]) close(id);
      tell();
      return;
    }
    for (const id of [...peers.keys()]) if (!members.some((m) => m.id === id)) close(id);
    for (const { id } of members) {
      if (id === me || peers.has(id)) continue;
      const peer = open(id);
      if (me < id) offer(id, peer);
    }
  }

  function link(id, to) {
    if (st.links.get(id) === to) return;
    to ? st.links.set(id, to) : st.links.delete(id);
    changed();
  }

  function open(id) {
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    const audio = new Audio();
    audio.autoplay = true;
    const peer = { pc, audio, queued: [] };
    peers.set(id, peer);
    for (const t of mic?.getAudioTracks() ?? []) pc.addTrack(t, mic);
    pc.onicecandidate = (e) => e.candidate && signal(id, { ice: e.candidate.toJSON() });
    pc.ontrack = (e) => {
      const stream = e.streams[0] ?? new MediaStream([e.track]);
      audio.srcObject = stream;
      // normally allowed (we joined with a click); if not, the next tap anywhere starts it
      audio.play().catch(() => document.addEventListener("pointerdown", () => audio.play().catch(() => {}), { once: true }));
      meter(id, stream);
    };
    pc.onconnectionstatechange = () => {
      if (peers.get(id) !== peer) return;
      const s = pc.connectionState;
      link(id, s === "connected" ? "on" : s === "failed" ? "failed" : "connecting");
      if (s === "failed" && me < id) offer(id, peer, true);  // a path that died (network change): try again
    };
    link(id, "connecting");
    return peer;
  }

  function close(id) {
    const peer = peers.get(id);
    if (!peer) return;
    peers.delete(id);
    peer.pc.onicecandidate = peer.pc.ontrack = peer.pc.onconnectionstatechange = null;
    peer.pc.close();
    peer.audio.pause(); peer.audio.srcObject = null;
    meters.get(id)?.source.disconnect(); meters.delete(id);
    link(id, null);
  }

  async function offer(id, peer, iceRestart = false) {
    try {
      await peer.pc.setLocalDescription(await peer.pc.createOffer({ iceRestart }));
      if (peers.get(id) === peer) signal(id, { sdp: peer.pc.localDescription.toJSON() });
    } catch {}  // closed meanwhile
  }

  async function onSignal(from, data) {
    if (st.status !== "on") return;
    try {
      const what = JSON.parse(data);
      const peer = peers.get(from) ?? open(from);
      const { pc } = peer;
      if (what.sdp) {
        await pc.setRemoteDescription(what.sdp);
        for (const c of peer.queued.splice(0)) await pc.addIceCandidate(c);
        if (what.sdp.type === "offer") {
          await pc.setLocalDescription(await pc.createAnswer());
          if (peers.get(from) === peer) signal(from, { sdp: pc.localDescription.toJSON() });
        }
      } else if (what.ice) {
        if (pc.remoteDescription) await pc.addIceCandidate(what.ice); else peer.queued.push(what.ice);
      }
    } catch {}  // malformed, or for a connection closed since
  }

  function meter(id, stream) {
    if (!ctx) return;
    meters.get(id)?.source.disconnect();
    const node = ctx.createAnalyser();
    node.fftSize = 512;
    const source = ctx.createMediaStreamSource(stream);
    source.connect(node);  // not to the speakers: the audio elements play it
    meters.set(id, { node, source });
  }

  function measure() {
    const now = new Set(), samples = new Float32Array(512);
    for (const [id, { node }] of meters) {
      node.getFloatTimeDomainData(samples);
      let sum = 0;
      for (const x of samples) sum += x * x;
      if (Math.sqrt(sum / samples.length) > 0.02 && !(id === me && st.muted)) now.add(id);
    }
    if ([...now].sort().join() !== [...st.speaking].sort().join()) { st.speaking = now; changed(); }
  }

  addEventListener("pagehide", () => leave());
  return { state: st, join, leave, setMuted, sync, onSignal };
}

/* ---------- archive ---------- */
async function archivePage() {
  $("#archive").hidden = false;
  const rematchOf = new URLSearchParams(location.search).get("rematch");
  const collabNext = new URLSearchParams(location.search).get("collab");  // as chosen on the rematch panel
  $("#archive .for").hidden = !rematchOf;
  const { number: today } = await (await fetch("/today")).json();
  const played = new Set(pastDuels().map((d) => d.number));
  const dateOf = (n) => new Date(Date.UTC(2022, 0, 29 + n - 1));
  const months = new Map();
  for (let n = today; n >= 1; n--) {
    const d = dateOf(n);
    const key = d.toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
    if (!months.has(key)) months.set(key, []);
    const b = el("button", { class: played.has(n) ? "played" : "", title: played.has(n) ? "played" : "" },
      el("b", { class: "num" }, `#${n}`),
      el("small", {}, d.toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" })));
    b.onclick = () => (rematchOf ? rematch(rematchOf, n, b, undefined, collabNext === null ? undefined : collabNext === "1") : newDuel(n, b));
    months.get(key).push(b);
  }
  $("#archive .months").replaceChildren(...[...months].flatMap(([m, bs]) => [el("h3", {}, m), el("div", { class: "grid" }, ...bs)]));
}

/* ---------- duel ---------- */
// /d/<room> opens the room's latest round (unless you're still racing an earlier one); ?round opens just that one.
async function openDuel(code) {
  let id = code;
  if (!new URLSearchParams(location.search).has("round")) {
    try { id = (await (await fetch(`/d/${code}/head?player=${encodeURIComponent(me)}`)).json()).id ?? code; } catch {}
  }
  duelPage(id);
}

function duelPage(id) {
  $("#duel").hidden = false;
  const base = `/d/${id}`;
  let view = null, skew = 0, seen = null, draft = "", pending = [];  // pending: my guesses sent but not yet scored
   // seen: guesses already drawn, so only new ones flash
  let sort = { by: "score", dir: -1 };  // the lists' order: a column of SORTS, and which way (-1: high to low). Best first to start
  let recall = null, flashRecall = false;  // a word I'd already guessed: shown up top again, like Semantle does
  let note = null;  // {word, msg}: why my last word didn't count
  let picking = false, today = null;  // rematch: choosing a puzzle
  let nextCollab = null;  // rematch: compete or collab, if changed from this round's
  let openRival = null;  // on a phone, whose list is open under the strip
  fetch("/today").then((r) => r.json()).then((t) => { today = t.number; if (view) render(); }).catch(() => {});

  const join = (name) => post(`${base}/join`, { player: me, name });
  const savedName = store.get("sd-name");
  // Joined on the first view: in the lobby, or to refresh your name if you're already in. Mid-game you start out watching.
  let greeted = false;
  if (savedName) { $("#name").value = savedName; $("#latename").value = savedName; }
  $("#watch").onsubmit = async (e) => {
    e.preventDefault();
    const name = $("#latename").value.trim();
    if (!name) return $("#latename").focus();
    store.set("sd-name", name);
    $("#name").value = name;
    const r = await join(name);
    if (r.view) apply(r.view);
  };
  // your name in the lobby list is its own input: shown, with a pencil, or being edited
  let editing = !savedName;
  const showMine = () => {
    $("#nameform").hidden = !editing;
    $("#mine .me").hidden = $("#mine .pencil").hidden = editing;
  };
  showMine();
  $("#mine .pencil").onclick = () => { editing = true; showMine(); $("#name").focus(); $("#name").select(); };

  const inNow = () => !!view?.players.some((p) => p.id === me);
  let blurred = false;  // a submit from leaving the box only keeps the name; Enter (or "join") also joins
  $("#nameform").onsubmit = (e) => {
    e.preventDefault();
    const name = $("#name").value.trim();
    if (!name) { const was = store.get("sd-name"); if (!was) return; $("#name").value = was; }
    else { store.set("sd-name", name); if (inNow() || !blurred) join(name).then((r) => r.view && apply(r.view)); }
    editing = false; showMine();
    if (view) render();
  };
  $("#name").onblur = () => { blurred = true; $("#nameform").requestSubmit(); blurred = false; };
  $("#mine .joinbtn").onclick = () => {
    const name = $("#name").value.trim() || store.get("sd-name");
    if (!name) { editing = true; showMine(); return $("#name").focus(); }
    store.set("sd-name", name);
    join(name).then((r) => r.view && apply(r.view));
  };
  // Your name in the list follows the box as you type; everyone else sees it once you pause.
  let naming = null;
  $("#name").oninput = () => {
    const name = $("#name").value.trim();
    if (view?.status === "lobby") render();
    clearTimeout(naming);
    if (name && inNow()) naming = setTimeout(() => (store.set("sd-name", name), join(name)), 300);
  };
  $("#go").onclick = () => {
    const mine = view?.players.find((p) => p.id === me);
    if (mine) post(`${base}/ready`, { player: me, ready: !mine.ready }).then((r) => r.view && apply(r.view));
  };
  $("#share").onclick = async () => {
    const link = `${location.origin}/d/${view?.room ?? id}`;  // the room's link, whichever round this is
    try { await navigator.clipboard.writeText(link); $("#share").textContent = "copied"; }
    catch { $("#share").textContent = link; }
    setTimeout(() => ($("#share").textContent = "copy link"), 1600);
  };

  // Live updates. Phones drop these streams silently (sleep, network switch), so the
  // server pings every 15s and we reconnect when it's gone quiet.
  let es = null, heard = 0;
  const connect = () => {
    es?.close();
    heard = Date.now();
    es = new EventSource(`${base}/events?player=${encodeURIComponent(me)}`);
    es.onmessage = (e) => { heard = Date.now(); apply(JSON.parse(e.data)); };
    es.addEventListener("ping", () => (heard = Date.now()));
    es.addEventListener("signal", (e) => { heard = Date.now(); const m = JSON.parse(e.data); voice.onSignal(m.from, m.data); });
  };
  // In voice when the page goes (a reload, or into a rematch): the next page here joins voice by itself,
  // if it comes within 30s. Registered before the voice chat's own pagehide, which leaves voice.
  const carry = (into) => { try { if (voice.state.status === "on") sessionStorage.setItem(VOICE_INTO, `${into}|${Date.now()}`); } catch {} };
  addEventListener("pagehide", () => { try { if (!sessionStorage.getItem(VOICE_INTO)) carry(id); } catch {} });
  const voice = voiceChat(base, () => view && voiceBar(view));
  intoRematch = carry;
  let rejoinVoice = false;  // join once we're a player here
  try {
    const [into, at] = (sessionStorage.getItem(VOICE_INTO) ?? "").split("|");
    rejoinVoice = into === id && Date.now() - Number(at) < 30_000;
    sessionStorage.removeItem(VOICE_INTO);
  } catch {}
  connect();
  setInterval(() => Date.now() - heard > 40_000 && connect(), 5_000);
  document.addEventListener("visibilitychange", () => !document.hidden && Date.now() - heard > 20_000 && connect());

  // tell the server we're still here (even from a background tab), so it can stop the
  // clock once everyone racing has actually disconnected
  const racing = () => view?.status === "playing" && view.players.some((p) => p.id === me && !p.finish);
  const here = () => racing() && post(`${base}/here`, { player: me });
  setInterval(here, 10_000);
  document.addEventListener("visibilitychange", here);

  function apply(v) {
    if (view && v.now < view.now) return;  // an older snapshot arriving late
    view = currentView = v;
    skew = view.now - Date.now();
    voice.sync(v.voice);
    if (rejoinVoice && v.players.some((p) => p.id === me)) { rejoinVoice = false; voice.join(); }
    // The same news often comes twice (the reply to a guess, then the event stream): redraw once, so a
    // second redraw a few ms later doesn't cut the first one's animations short.
    const { now: _n, elapsed: _e, ...rest } = v;
    const sig = JSON.stringify(rest);
    if (sig === drawn) return;
    drawn = sig;
    render();
  }
  let drawn = null;  // what was last drawn, less the clock

  setInterval(tick, 250);

  function tick() {
    if (!view) return;
    const now = Date.now() + skew;
    const c = $("#clock");
    if (view.status === "lobby") c.textContent = "0:00";
    else if (now < view.startsAt) c.textContent = String(Math.ceil((view.startsAt - now) / 1000));
    else c.textContent = mmss(view.elapsed + (view.status === "playing" && !view.paused ? now - Math.max(view.now, view.startsAt) : 0));
    if (view.status === "countdown" && now >= view.startsAt) { view.status = "playing"; render(); }
  }

  function render() {
    const v = view;
    if (!greeted) {
      greeted = true;
      // already in it, or a lobby of a room you made or have played in: in you go. Anywhere else, "join".
      const known = made().includes(v.room) || myRooms().some((r) => r.room === v.room);
      if (savedName && v.setter?.id !== me && (v.players.some((p) => p.id === me) || (v.status === "lobby" && known))) join(savedName);
    }
    remember(v);
    const setting = v.setter?.id === me;  // you set the word: you watch, seeing every word
    // which word: Semantle's puzzle (linked), one somebody set, or a random draw, which says only that until
    // the word is out (then, if it was one of Semantle's, its number and link)
    const numbered = v.number && (v.mode !== "random" || v.secret);
    const solved = numbered && pastDuels().some((d) => d.id !== v.id && d.number === v.number && d.found);
    $(".no").textContent = numbered ? `#${v.number}${v.number === today ? " (today)" : ""}${solved ? " (played)" : ""}`
      : v.mode === "set" ? (setting ? `you set “${v.secret}”` : `set by ${v.setter?.name ?? "someone"}`) : "a random word";
    if (!numbered) $(".no").removeAttribute("href");
    // semantle.com's archive only has past puzzles; today's is its front page
    if (numbered) $(".no").href = v.number === today ? "https://semantle.com/" : `https://semantle.com/archive/game?num=${v.number}`;
    const inIt = v.players.some((p) => p.id === me);
    const lobby = v.status === "lobby";

    $("#lobby").hidden = !lobby;
    $("#watch").hidden = inIt || setting || lobby || v.status === "over" || v.players.length >= v.max;
    $("#share").hidden = !lobby;
    if (lobby) {
      // you first (your entry is kept, not redrawn, so typing in it isn't interrupted), then everyone else
      const tick = (p) => (p.ready ? el("span", { class: "ok", title: "ready" }, "✓") : "");
      const mine = v.players.find((p) => p.id === me);
      $("#mine").hidden = setting || (!mine && v.players.length >= v.max);
      $("#mine .joinbtn").hidden = !!mine;
      $("#mine .me").replaceChildren($("#name").value.trim() || mine?.name || "", ...(mine ? [tick(mine)] : []));
      // someone whose page has closed: greyed, "away"; the server drops them if they don't come back soon
      const away = (p) => v.here && !v.here.includes(p.id);
      const others = v.players.filter((p) => p.id !== me).map((p) => el("span", { class: away(p) ? "away" : "" }, el("span", {}, p.name), tick(p), away(p) ? el("small", {}, " away") : ""));
      if (v.players.length + (mine ? 0 : 1) < v.max) others.push(el("span", { class: "empty" }, "…"));
      $("#lobby .who .others").replaceChildren(...others);
      $("#lobby .mode").replaceChildren(modeToggle(v.collab, mine && ((collab) => post(`${base}/collab`, { player: me, collab }).then((r) => r.view && apply(r.view)))));
      // everyone says ready, then the countdown starts by itself
      const go = $("#go");
      go.disabled = !mine;
      go.hidden = setting;
      go.classList.toggle("on", !!mine?.ready);
      go.textContent = mine?.ready ? "not ready" : "ready";
      const unready = v.players.filter((p) => !p.ready && p.id !== me).map((p) => p.name);
      $("#lobby .wait").textContent = !mine?.ready ? ""
        : v.players.length < 2 ? "waiting for an opponent…"
        : unready.length ? `waiting for ${unready.join(", ")}…` : "";
    }

    // your own result, once you have one
    const mine = v.players.find((p) => p.id === me);
    const banner = $("#banner");
    banner.hidden = !mine?.finish;
    if (mine?.finish) {
      const n = v.collab ? v.players.reduce((sum, p) => sum + p.guesses.length, 0) : mine.guesses.length;
      const finder = v.collab ? v.players.find((p) => p.guesses.some((g) => g.word === v.secret)) : mine;
      banner.replaceChildren(...(mine.finish.found
        ? [`${finder?.id === me ? "you" : finder?.name ?? "the room"} found `, el("b", {}, v.secret), " in ", el("span", { class: "num" }, `${n}`), n === 1 ? " guess" : " guesses"]
        : [v.collab ? "the room gave up. it was " : "you gave up. it was ", el("b", {}, v.secret)]));
    }
    after(v, mine);
    record(v, mine);
    pausebar(v, mine);
    voiceBar(v);

    const board = $("#board");
    board.hidden = lobby;
    if (lobby) return;
    // you first; opponents after, by standing once they finish
    const order = standings(v);
    const rank = (p) => (p.id === me ? -1 : p.finish ? order.indexOf(p) : 99);
    const sides = v.collab ? [roomSide(v)] : [...v.players].sort((a, b) => rank(a) - rank(b));
    board.classList.toggle("together", !!v.collab);
    board.classList.toggle("crowd", sides.length > 2);
    board.classList.toggle("mine", inIt);
    const focused = document.activeElement?.id === "guess";
    // a crowd: the first (you) on the left, everyone else stacked beside
    const drawn = sides.map((p) => side(p, v));
    const before = rowsAt();
    board.replaceChildren(...(sides.length > 2 ? [drawn[0], el("div", { class: "others" }, ...drawn.slice(1))] : drawn));
    strip(v, sides.filter((p) => p.id !== me), inIt);
    glide(before);
    seen = new Set(v.players.flatMap((p) => [...p.guesses.map((g) => `${p.id}:${g.n}`), ...(p.checks ?? []).map((c, k) => `${p.id}:c${k}`)]));
    flashRecall = false;
    if (focused || (v.status === "playing" && inIt && !matchMedia("(hover: none)").matches)) $("#guess")?.focus({ preventScroll: true });  // a redraw keeps the box focused but never scrolls you back up to it
  }

  function pausebar(v, mine) {
    const bar = $("#pausebar");
    const racer = mine && !mine.finish && v.status === "playing";
    $("#clock").classList.toggle("stopped", !!v.paused);
    $("#board").classList.toggle("paused", !!(v.paused && racer));
    const toggle = (label, paused) => {
      const b = el("button", { type: "button" }, label);
      b.onclick = () => post(`${base}/pause`, { player: me, paused }).then((r) => r.view && apply(r.view));
      return b;
    };
    const by = v.paused?.by && v.players.find((p) => p.id === v.paused.by);
    const quit = racer && v.collab ? [" · ", ...giveUpVote(v)] : [];  // (a round can be given up while paused, so the vote stays)
    const kids = !v.paused ? (racer ? ["·", toggle("pause", true), " · ", ...hint(v), ...quit] : [])
      : [`· ${!by ? "paused while away" : by.id === me ? "paused" : `${by.name} paused`}`, racer ? toggle("resume", false) : "", ...quit];
    bar.replaceChildren(...kids);
  }

  // A hint is given to everyone still racing, once all of them have asked for it.
  const hint = (v) => vote(v, v.hintAsks ?? [], { action: "hint", label: "hint", asking: "hint asked", wants: "a hint" });
  // In co-op, so is giving up: it ends the round for the room.
  const giveUpVote = (v) => vote(v, v.giveUpAsks ?? [], { action: "askgiveup", label: "give up", asking: "asked to give up", wants: "to give up" });

  function vote(v, asks, { action, label, asking, wants }) {
    const ask = (want, text) => {
      const b = el("button", { type: "button" }, text);
      b.onclick = () => post(`${base}/${action}`, { player: me, want }).then((r) => { if (r.view) apply(r.view); if (!r.ok && r.error) { note = { word: label, msg: r.error }; render(); } });
      return b;
    };
    const others = v.players.filter((p) => p.id !== me && !p.finish);
    const asked = others.filter((p) => asks.includes(p.id)).map((p) => p.name);
    const notYet = others.filter((p) => !asks.includes(p.id)).map((p) => p.name);
    if (asks.includes(me)) return [el("span", {}, `${asking}, waiting for ${notYet.join(", ")}`), ask(false, "cancel")];
    if (asked.length) return [el("span", { class: "ask" }, `${asked.join(", ")} ${asked.length > 1 ? "want" : "wants"} ${wants}`), ask(true, "agree")];
    return [ask(true, label)];
  }

  // voice chat, for the duel's players: join, then who's in (lit while talking), mute and leave
  function voiceBar(v) {
    const bar = $("#voice"), st = voice.state;
    const inIt = v.players.some((p) => p.id === me) || v.setter?.id === me;  // the setter may talk too
    bar.hidden = !inIt || !window.RTCPeerConnection || !navigator.mediaDevices;
    if (bar.hidden) return;
    const members = v.voice ?? [];
    const nameOf = (id) => (id === me ? "you" : v.players.find((p) => p.id === id)?.name ?? (v.setter?.id === id ? v.setter.name : "?"));
    const btn = (label, fn) => { const b = el("button", { type: "button" }, label); b.onclick = fn; return b; };
    const kids = [];
    if (st.status === "off") {
      const others = members.filter((m) => m.id !== me).map((m) => nameOf(m.id));
      const b = btn("join voice", () => voice.join());
      if (others.length) b.classList.add("call");
      kids.push(b);
      if (others.length) kids.push(el("span", {}, `${others.join(", ")} ${others.length > 1 ? "are" : "is"} in`));
      if (st.error) kids.push(el("span", { class: "err" }, st.error));
    } else if (st.status === "asking") {
      kids.push(el("span", {}, "asking for the microphone…"));
    } else {
      const list = [{ id: me, muted: st.muted }, ...members.filter((m) => m.id !== me)];
      kids.push(el("span", { class: "who" }, "voice: ", ...list.flatMap((m, i) => {
        const failed = m.id !== me && st.links.get(m.id) === "failed";
        const cls = st.speaking.has(m.id) ? "talking" : m.muted ? "muted" : failed || (m.id !== me && st.links.get(m.id) !== "on") ? "off" : "";
        const label = nameOf(m.id) + (m.muted ? " (muted)" : failed ? " (can’t connect)" : "");
        return [i ? ", " : "", el("span", { class: cls }, label)];
      })));
      kids.push(btn(st.muted ? "unmute" : "mute", () => voice.setMuted(!st.muted)), btn("leave", () => voice.leave()));
    }
    bar.replaceChildren(...kids);
  }

  // The room's record so far, between rounds and once you've finished: wins, and how you stand against each other player.
  let book = null, booked = null;  // the tally, and the duel and status it was fetched for
  function record(v, mine) {
    const box = $("#tally");
    const when = `${v.id}:${v.status}`;
    if (booked !== when) {
      booked = when;
      fetch(`${base}/tally`).then((r) => r.json()).then((t) => { book = t; if (view) record(view, view.players.find((p) => p.id === me)); }).catch(() => {});
    }
    box.hidden = !(book?.rounds || book?.together) || !(v.status === "lobby" || v.status === "over" || mine?.finish);
    if (box.hidden) return;
    const ps = Object.entries(book.players).sort(([, a], [, b]) => b.wins - a.wins || b.played - a.played);
    const top = ps[0]?.[1].wins;
    const line1 = el("span", {}, book.rounds ? `this room · ${book.rounds} ${book.rounds === 1 ? "round" : "rounds"}: ` : "this room",
      ...ps.flatMap(([id, p], i) => [i ? " · " : "", el("span", { class: top && p.wins === top ? "lead" : "" }, el("b", {}, id === me ? "you" : p.name), ` ${p.wins}`)]),
      ...(book.together ? [" · ", el("b", {}, `${book.together}`), " solved together"] : []));
    const vs = ps.filter(([id]) => id !== me).map(([id, p]) => {
      const [k, flip] = me < id ? [`${me}|${id}`, false] : [`${id}|${me}`, true];
      const h = book.h2h[k];
      if (!h) return null;
      const [w, l] = flip ? [h[1], h[0]] : h;
      return `vs ${p.name} ${w}–${l}`;
    }).filter(Boolean);
    box.replaceChildren(line1, ...(vs.length ? [el("span", {}, "you ", vs.join(" · "))] : []));
  }

  // once you're done: rematch (same opponents, a puzzle of your choosing) or home
  function after(v, mine) {
    const nav = $("#after");
    nav.hidden = !(mine ? mine.finish : v.status === "over");
    if (nav.hidden) return;
    const kids = [];
    if (v.next) {
      const a = el("a", { href: `/d/${v.room}`, class: "lead" }, "join the rematch →");
      a.onclick = () => intoRematch(v.next);
      kids.push(a);
    }
    else if (mine && v.players.length > 1 && !picking) {
      const b = el("button", { class: "lead", type: "button" }, "rematch");
      b.onclick = () => { picking = true; render(); };
      kids.push(b);
    } else if (mine && v.players.length > 1) {
      const collab = nextCollab ?? !!v.collab;  // as this round, unless changed
      const go = (label, puzzle) => {
        const b = el("button", { type: "button" }, label);
        b.onclick = async () => rematch(v.id, await puzzle(), b, undefined, collab);
        return b;
      };
      kids.push(modeToggle(collab, (c) => { nextCollab = c; render(); }), el("span", { class: "pick" },
        el("span", {}, "rematch on"),
        (() => { const b = el("button", { type: "button" }, "a random word"); b.onclick = () => rematch(v.id, undefined, b, "random", collab); return b; })(),
        today && today !== v.number ? go("today’s", async () => today) : "",
        el("a", { href: `/archive?rematch=${v.id}&collab=${collab ? 1 : 0}` }, "the archive"),
      ));
    }
    kids.push(el("a", { href: "/", class: "quiet" }, "home"));
    nav.replaceChildren(...kids);
  }

  // Compete or collab. `pick` (a new value) is left out for someone who only gets to see it.
  function modeToggle(collab, pick) {
    const opt = (label, value) => {
      const b = el("button", { type: "button", "aria-pressed": String(!!collab === value) }, label);
      b.disabled = !pick;
      if (pick && !!collab !== value) b.onclick = () => pick(value);
      return b;
    };
    return el("span", { class: "modes" }, opt("compete", false), opt("collab", true));
  }

  // A co-op round is one board, drawn by side() as if it were yours: everyone's guesses in one list, each
  // knowing who made it (by). Whoever is only watching gets the same board, without the box to type in.
  function roomSide(v) {
    const guesses = v.players.flatMap((p) => p.guesses.map((g) => ({ ...g, by: p.id }))).sort((a, b) => a.n - b.n);
    return { id: me, guesses, checks: v.players.find((p) => p.id === me)?.checks, finish: v.players[0]?.finish ?? null };
  }

  // Each person's latest word (hints are nobody's).
  function lastGuesses(v) {
    const ps = [...v.players].sort((a, b) => (b.id === me) - (a.id === me));
    return el("div", { class: "lasts" }, ...ps.map((p) =>
      el("span", {}, el("b", {}, p.id === me ? "you" : p.name), " ", p.guesses.findLast((g) => !g.hint)?.word ?? "–")));
  }

  function side(p, v) {
    const mine = p.id === me;
    const best = p.guesses.reduce((m, g) => Math.max(m, g.score), -Infinity);
    const n = p.guesses.length;
    const f = p.finish;
    const place = f?.found ? standings(v).indexOf(p) + 1 : 0;
    const div = el("div", { class: "side" + (mine ? " me" : "") + (f?.found ? " found" : "") + (place === 1 ? " first" : "") });
    div.append(el("h2", {},
      el("span", { class: "name" }, v.collab ? "together" : mine ? "you" : p.name),
      el("span", { class: "stat num" },
        f?.found ? `${v.collab ? "found" : ordinal(place)} · ${mmss(f.time)} · ${n}`
        : f ? `gave up · ${n}`
        : n ? `${n} · ${best.toFixed(2)}` : ""),
    ));
    if (v.collab) div.append(lastGuesses(v));

    // racing: guess; finished: keep checking words, just for their scores
    if (mine && v.players.some((q) => q.id === me) && (v.status === "playing" || v.status === "over")) {
      const form = el("form", {});
      const input = el("input", { class: "line", id: "guess", placeholder: f ? "check a word" : "type a guess", autocomplete: "off", autocapitalize: "off", spellcheck: "false", enterkeyhint: "go" });
      input.value = draft;
      input.oninput = () => (draft = input.value);
      const quit = el("button", { class: "giveup", type: "button" }, "give up");
      quit.onclick = () => {
        if (quit.dataset.sure) return post(`${base}/giveup`, { player: me });
        quit.dataset.sure = 1; quit.textContent = "sure?";
        setTimeout(() => { delete quit.dataset.sure; quit.textContent = "give up"; }, 2500);
      };
      const submit = el("button", { class: "submit", type: "submit" }, "guess");
      submit.onpointerdown = (e) => e.preventDefault();  // keep the keyboard up on phones
      if (v.paused && !f) { input.disabled = true; submit.disabled = true; }
      if (f) submit.textContent = "check";
      form.append(input, submit, f || v.collab ? "" : quit);  // (co-op: giving up is a vote, up by the clock)
      form.onsubmit = async (e) => {
        e.preventDefault();
        const word = input.value.trim().toLowerCase();
        if (!word) return;
        draft = ""; input.value = "";
        note = null; recall = null;
        const mineNow = view.players.find((q) => q.id === me);
        const known = [...(view.collab ? view.players.flatMap((q) => q.guesses) : mineNow?.guesses ?? []), ...(mineNow?.checks ?? [])];
        if (known.some((g) => g.word === word)) { recall = word; flashRecall = true; return render(); }
        if (pending.includes(word)) return render();
        pending.push(word); render();
        const r = await post(`${base}/guess`, { player: me, word });
        pending = pending.filter((w) => w !== word);
        if (r.view) apply(r.view);  // draws it (once), unless the event stream already did
        if (!r.ok) {
          if (r.error === "already guessed") { recall = word; flashRecall = true; }
          else note = { word, msg: r.error === "upstream trouble" ? "server hiccup, try again" : r.error ?? "try again" };
          render();
        } else if (!r.view) render();
      };
      div.append(form);
    } else if (!mine && v.players.length === 2 && v.players.some((q) => q.id === me) && (v.status === "playing" || v.status === "over")) {
      // side by side: an empty stand-in for the box, so both lists start at the same height
      div.append(el("form", { class: "slot", "aria-hidden": "true" }, el("input", { class: "line", tabindex: "-1", disabled: "disabled" }), el("button", { class: "submit", type: "button", tabindex: "-1" }, "guess")));
    }

    const ol = el("ol", {});
    // words checked after finishing sit among the guesses, unnumbered
    const all = [...p.guesses, ...(p.checks ?? []).map((c, k) => ({ ...c, n: null, k, check: true }))];
    if (mine) pending = pending.filter((w) => !all.some((g) => g.word === w));
    if (mine && note && all.some((g) => g.word === note.word)) note = null;  // it got through after all
    const waiting = mine ? pending : [];
    const again = mine && recall ? all.find((g) => g.word === recall) : null;
    const told = mine && note;
    if (all.length || waiting.length || told) ol.append(heads(sort, pickSort));
    const last = all.reduce((a, g) => (!a || g.at >= a.at ? g : a), null);
    // a crowded table keeps opponents short until the end: their best by similarity, ordered as chosen
    const cap = !mine && v.players.length > 2 && v.status !== "over" ? 8 : Infinity;
    const more = all.length - cap;
    const sorted = sortGuesses([...all].sort((a, b) => b.score - a.score).slice(0, cap));
    // One row up top, for whatever happened last: a word that didn't count, one being scored, one already
    // guessed, or the latest guess. (A note is newer than anything pending: sending a word clears it.)
    if (told) ol.append(el("li", { class: "note latest", "data-key": `${p.id}:latest` }, el("span", { class: "n" }, ""), el("span", { class: "w" }, note.word), el("span", { class: "msg" }, note.msg)));
    else if (waiting.length) ol.append(el("li", { class: "pending latest", "data-key": `${p.id}:latest` }, el("span", { class: "n num" }, ""), el("span", { class: "w" }, waiting.at(-1)), el("span", { class: "s num" }, "…"), el("span", {})));
    else if (again) ol.append(row(again, p, v, true, flashRecall));
    else if (last && all.length > 1) ol.append(row(last, p, v, true));
    // gave up: the word they didn't get, where it would have sat
    if (f && !f.found && v.secret) ol.append(el("li", { class: "missed", "data-key": `${p.id}:missed` }, el("span", { class: "n" }, ""), el("span", { class: "w" }, v.secret), el("span", { class: "s num" }, "100.00"), el("span", { class: "p" }, "😞")));
    for (const g of sorted) ol.append(row(g, p, v, false));
    if (more > 0) ol.append(el("li", { class: "more", "data-key": `${p.id}:more` }, `+${more}`));
    if (v.collab) ol.querySelector(".heads")?.children[1].after(el("span", { class: "by" }, "Who"));
    div.append(ol);
    return div;
  }

  // The list's order, one choice for every list on the page. A column starts in its natural direction
  // (`first`); picking it again turns it round.
  const SORTS = {
    n: { first: -1, cmp: (a, b) => (a.at - b.at) || ((a.n ?? 1e9) - (b.n ?? 1e9)) },  // checks (n null) sit by time
    word: { first: 1, cmp: (a, b) => (a.word && b.word ? a.word.localeCompare(b.word) : 0), last: (g) => !g.word },  // hidden words last, whichever way
    score: { first: -1, cmp: (a, b) => a.score - b.score },
    rank: { first: -1, cmp: (a, b) => (a.rank ? 1000 + a.rank : a.score) - (b.rank ? 1000 + b.rank : b.score) },
  };
  function sortGuesses(list) {
    const { cmp, last = () => false } = SORTS[sort.by];  // `last` rows stay at the end in both directions
    return [...list].sort((a, b) => (last(a) - last(b)) || sort.dir * cmp(a, b) || b.score - a.score || (a.n ?? 1e9) - (b.n ?? 1e9));
  }
  function pickSort(by) {
    sort = { by, dir: sort.by === by ? -sort.dir : SORTS[by].first };
    render();
  }

  // Rows move rather than jump: before a redraw, where each row was (by key); after it, each one starts
  // there and slides to its new place, and rows that are new fade in. Only what's on screen.
  function rowsAt() {
    const at = new Map();
    for (const li of document.querySelectorAll("#duel li[data-key]")) {
      if (li.offsetParent) at.set((li.closest("#rivals") ? "r:" : "b:") + li.dataset.key, li.getBoundingClientRect().top);
    }
    return at;
  }
  function glide(before) {
    if (!before.size || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const h = innerHeight;
    for (const li of document.querySelectorAll("#duel li[data-key]")) {
      if (!li.offsetParent) continue;
      const now = li.getBoundingClientRect().top, was = before.get((li.closest("#rivals") ? "r:" : "b:") + li.dataset.key);
      if (was === undefined) {
        if (now > -60 && now < h) li.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: "ease-out" });
      } else if (Math.abs(was - now) >= 1 && Math.min(was, now) < h && Math.max(was, now) > -60) {
        li.animate([{ transform: `translateY(${was - now}px)` }, { transform: "none" }], { duration: 170, easing: "cubic-bezier(.2,.7,.3,1)" });
      }
    }
  }

  // phone: everyone else in one strip (finished by place, then by best score); tap a name for their list
  function strip(v, others, inIt) {
    const box = $("#rivals");
    box.hidden = !inIt || !others.length;
    if (box.hidden) return;
    const order = standings(v);
    const best = (p) => p.guesses.reduce((b, g) => (!b || g.score > b.score ? g : b), null);
    const key = (p) => (p.finish?.found ? order.indexOf(p) - 1e6 : p.finish ? 1e6 : -(best(p)?.score ?? -1e3));
    const sorted = [...others].sort((a, b) => key(a) - key(b));
    if (openRival && !others.some((p) => p.id === openRival)) openRival = null;
    const lead = sorted[0];
    $("#rivals .strip").replaceChildren(...sorted.map((p) => {
      const f = p.finish, b = best(p), last = p.guesses.at(-1);
      const place = f?.found ? order.indexOf(p) + 1 : 0;
      const fresh = last && seen !== null && !seen.has(`${p.id}:${last.n}`);
      const first = place === 1 || (!order.some((q) => q.finish?.found) && p === lead && b);
      const chip = el("button", { type: "button", class: ["chip", openRival === p.id && "on", fresh && "fresh", first && "first", f?.found && "found"].filter(Boolean).join(" ") },
        el("span", { class: "name" }, p.name),
        f?.found ? el("span", { class: "mark num" }, `${ordinal(place)} · ${mmss(f.time)}`)
        : f ? el("span", { class: "mark" }, "gave up")
        : el("span", { class: "s num", style: b ? `color:${heat(b)}` : "" }, b ? b.score.toFixed(2) : "–"),
      );
      chip.onclick = () => { openRival = openRival === p.id ? null : p.id; render(); };
      return chip;
    }));
    const p = others.find((q) => q.id === openRival);
    const box2 = $("#rivals .open");
    if (!p) return box2.replaceChildren();
    const f = p.finish, last = p.guesses.at(-1), ol = el("ol", {});
    if (last && p.guesses.length > 1) ol.append(row(last, p, v, true));
    if (f && !f.found && v.secret) ol.append(el("li", { class: "missed", "data-key": `${p.id}:missed` }, el("span", { class: "n" }, ""), el("span", { class: "w" }, v.secret), el("span", { class: "s num" }, "100.00"), el("span", { class: "p" }, "😞")));
    for (const g of sortGuesses(p.guesses)) ol.append(row(g, p, v, false));
    if (!p.guesses.length) ol.append(el("li", { class: "more" }, "no guesses yet"));
    box2.replaceChildren(ol);
  }

  function row(g, p, v, isLatest, isAgain = false) {
    const key = g.check ? `c${g.k}` : g.n;
    const owner = g.by ?? p.id;  // on a co-op board, whoever guessed this one
    const fresh = (isLatest || p.guesses.length === 1) && seen !== null && !seen.has(`${owner}:${key}`);
    // yours lands quietly (the score fades in); someone else's gets a highlight
    const lands = fresh && owner === me;
    const li = el("li", { "data-key": `${p.id}:${isLatest ? "latest" : key}`, class: [isLatest && "latest", lands && "landed", fresh && !lands && "fresh", isAgain && "again", g.shared && "shared", g.check && "check", v.secret && g.word === v.secret && "secret"].filter(Boolean).join(" ") });
    const word = g.word ?? "x".repeat(4 + ((g.n * 7 + p.id.charCodeAt(0)) % 6));
    li.append(
      el("span", { class: "n num", title: g.shared ? "guessed by someone else too" : "" }, g.check ? "·" : g.n),
      el("span", { class: "w" + (g.word ? "" : " hidden") }, word, g.hint && !v.collab ? el("small", {}, "hint") : g.check ? el("small", {}, "after") : ""),
      ...(v.collab ? [el("span", { class: "by" }, g.hint ? "hint" : g.check ? "" : owner === me ? "you" : v.players.find((q) => q.id === owner)?.name ?? "")] : []),
      el("span", { class: "s num", style: `color:${heat(g)}` }, g.score.toFixed(2)),
      proximity(g),
    );
    return li;
  }
}

// Semantle's proximity column: rank out of 1000 with a bar, or a temperature word.
function proximity(g) {
  if (g.rank === 1000) return el("span", { class: "p found" }, "🔥🎉");
  if (g.rank) {
    const p = el("span", { class: "p num" }, el("span", {}, `${g.rank}/1000`), el("span", { class: "bar" }, el("i", { style: `width:${g.rank / 10}%;background:hsl(${Math.round((g.rank / 1000) * 125)} 68% 46%)` })));
    return p;
  }
  return el("span", { class: "p temp" }, g.score < 0 ? "(far)" : g.score < 20 ? "(cold)" : "(tepid)");
}

function heat(g) {
  if (g.rank) return "var(--hot)";
  if (g.score >= 20) return "var(--warm)";
  return "var(--faint)";
}

// The column names, each a button that sorts by it; an arrow on the one in use (sort: {by, dir}).
function heads(sort, pick) {
  const col = (by, label, cls) => {
    const on = sort.by === by;
    const b = el("button", { type: "button", class: "sortby" + (on ? " on" : ""), "aria-label": `sort by ${label}`, "aria-pressed": on ? "true" : "false" }, label, on ? el("i", {}, sort.dir < 0 ? "▾" : "▴") : "");
    b.onclick = () => pick(by);
    return el("span", cls ? { class: cls } : {}, b);
  };
  return el("li", { class: "heads" }, col("n", "#"), col("word", "Guess"), col("score", "Similarity", "s"), col("rank", "Proximity"));
}

function ordinal(n) {
  return n + (["th", "st", "nd", "rd"][n] ?? "th");
}

function mmss(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return (h ? `${h}:${String(m).padStart(2, "0")}` : `${m}`) + `:${String(r).padStart(2, "0")}`;
}

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== "" && v != null) e.setAttribute(k, v);
  e.append(...kids.map((k) => (typeof k === "number" ? String(k) : k)));
  return e;
}
</script>
